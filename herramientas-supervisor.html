<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Supervisor - Herramientas</title> 

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

.top-header {
  background: linear-gradient(135deg, #111827, #1f2937);
  color: white;
  padding: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: left;
  box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

.logo-dimarza {
  width: 90px;
  height: 90px;
  object-fit: contain;
  background: white;
  border-radius: 16px;
  padding: 8px;
}

.top-header h1 {
  margin: 0;
  font-size: 30px;
}

.top-header p {
  margin: 6px 0 0;
  color: #d1d5db;
}

    .container {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    label {
      font-weight: bold;
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.stat {
  background: white;
  padding: 16px 18px;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  border-left: 6px solid #2563eb;
}

.stat strong {
  display: block;
  font-size: 26px;
  color: #111827;
}

.stat span {
  font-size: 14px;
  color: #4b5563;
}

.stat.pendiente {
  border-left-color: #f59e0b;
}

.stat.aprobado {
  border-left-color: #16a34a;
}

.stat.observado {
  border-left-color: #dc2626;
}

.stat.devuelto {
  border-left-color: #374151;
}

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .pendiente {
      background: #fef3c7;
      color: #92400e;
    }

    .aprobado {
      background: #dcfce7;
      color: #166534;
    }

    .observado {
      background: #fee2e2;
      color: #991b1b;
    }

    .vacio {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-ver {
      background: #111827;
      padding: 8px 12px;
      font-size: 13px;
    }

    .btn-ver:hover {
      background: #374151;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-weight: bold;
    }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 1000;
  padding: 24px;
}

.modal-revision {
  background: #f9fafb;
  width: min(1200px, 96vw);
  max-height: 92vh;
  margin: auto;
  border-radius: 24px;
  padding: 24px;
  overflow-y: auto;
  box-shadow: 0 25px 80px rgba(0,0,0,0.35);
}

.modal-header {
  background: #111827;
  color: white;
  border-radius: 18px;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  font-size: 24px;
}

.modal-header p {
  margin: 5px 0 0;
  color: #d1d5db;
}

.close {
  background: #dc2626;
}

.seccion-detalle {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.seccion-detalle h3 {
  margin: 0 0 14px;
  font-size: 18px;
  color: #111827;
}

.detalle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.detalle-item {
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
}

.detalle-item strong {
  display: block;
  font-size: 12px;
  color: #374151;
  margin-bottom: 5px;
}

.detalle-item span {
  font-size: 14px;
  color: #111827;
}

.herramienta-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
  margin-bottom: 8px;
}
.herramienta-item::before {
  content: "✓";
  color: #16a34a;
  font-weight: bold;
  margin-right: 8px;
}

.herramienta-item strong {
  color: #111827;
}

.herramienta-item span {
  color: #374151;
  font-size: 13px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 22px;
}

.card-caja {
  background: white;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.09);
  border-left: 8px solid #f59e0b;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
    .card-caja{
    position:relative;
}

.card-caja::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    border-radius:22px 22px 0 0;
    background:#f59e0b;
}

.card-caja:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 35px rgba(0,0,0,0.12);
}
.card-caja:hover .card-img-box img{
    transform:scale(1.06);
}

.card-caja.aprobado {
  border-left-color: #16a34a;
}
    .card-caja.aprobado::before{
    background:#16a34a;
}

.card-caja.observado {
  border-left-color: #dc2626;
}
    .card-caja.observado::before{
    background:#dc2626;
}

.card-caja.devuelto {
  border-left-color: #374151;
}
    .card-caja.devuelto::before{
    background:#374151;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.card-img-box {
  width: 82px;
  height: 82px;
  border-radius: 18px;
  background: #f9fafb;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #e5e7eb;
}

.card-img-box img{
    width:90%;
    height:90%;
    object-fit:contain;
    transition:.25s;
}

.card-title h3 {
  margin: 0;
  font-size: 24px;
  color: #92400e;
}

.card-title small {
  color: #6b7280;
  font-size: 12px;
}

.card-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.card-info {
  background: #f9fafb;
  border-radius: 12px;
  padding: 10px;
  font-size: 13px;
  color: #374151;
}

.card-info strong {
  display: block;
  color: #111827;
  font-size: 12px;
  margin-bottom: 4px;
}

.card-id {
  margin-top: 12px;
  font-size: 12px;
  color: #6b7280;
  word-break: break-all;
}

.card-actions {
  margin-top: 18px;
}

.card-actions button {
  width: 100%;
  background:#f97316;
  padding: 13px;
  font-size: 14px;
}

.card-actions button:hover {
  background:#ea580c;
}
    
    @media (max-width: 800px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .detalle-grid {
        grid-template-columns: 1fr;
    }  
    }
  </style>
</head>

<body>
  <header class="top-header">
  <img src="img/mini-logo.png" alt="DIMARZA" class="logo-dimarza">
  <div>
    <h1>Control Supervisor</h1>
    <p>Sistema de gestión de herramientas</p>
  </div>
</header>

  <div class="container">
    <div class="panel">
      <div class="filters">
        <div>
          <label for="filtroSupervisor">Filtrar por supervisor</label>
          <select id="filtroSupervisor">
            <option value="">Todos los supervisores</option>
          </select>
        </div>
        <div>
          <label for="filtroEstado">Filtrar por estado</label>
          <select id="filtroEstado">
            <option value="">Todos los estados</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="APROBADO">Aprobado</option>
            <option value="OBSERVADO">Observado</option>
            <option value="DEVUELTO">Devuelto</option>
          </select>
        </div>
        <div>
          <label for="buscarTexto">Buscar</label>
          <input id="buscarTexto" type="text" placeholder="Caja, responsable, servicio o ID">
        </div>

        <div>
          <button onclick="cargarCajas()">Actualizar</button>
        </div>
      </div>
    </div>

    <div class="stats">
  <div class="stat pendiente">
    <strong id="totalPendientes">0</strong>
    <span>🟡 Pendientes</span>
  </div>

  <div class="stat aprobado">
    <strong id="totalAprobadas">0</strong>
    <span>🟢 Aprobadas</span>
  </div>

  <div class="stat observado">
    <strong id="totalObservadas">0</strong>
    <span>🔴 Observadas</span>
  </div>

  <div class="stat devuelto">
    <strong id="totalDevueltas">0</strong>
    <span>⚫ Devueltas</span>
  </div>
</div>

    <div id="contenedorCajas" class="cards-grid">
  <div class="loading">Cargando cajas...</div>
</div>
  </div>

<div id="modalDetalle" class="modal">
  <div class="modal-content modal-revision">
    <div class="modal-header">
      <div>
        <h2 id="tituloModal">Revisión de caja</h2>
        <p id="subtituloModal">Detalle del registro seleccionado</p>
      </div>
      <button class="close" onclick="cerrarModal()">Cerrar</button>
    </div>

    <div id="detalleRegistro"></div>
  </div>
</div>

  <script>

    const API_URL = 'https://script.google.com/macros/s/AKfycbze-9nRvim45Fa-Ffl_AVJLIjKO1_H9FL_BFTdsUxZsZuwuT2DVrZC0tBS4cURsGq6l/exec';

    let cajasGlobal = [];

    document.addEventListener('DOMContentLoaded', () => {
      cargarCajas();

      document.getElementById('filtroSupervisor').addEventListener('change', pintarTabla);
      document.getElementById('filtroEstado').addEventListener('change', pintarTabla);
      document.getElementById('buscarTexto').addEventListener('input', pintarTabla);
    });

    async function cargarCajas() {
      const contenedor = document.getElementById('contenedorCajas');
      contenedor.innerHTML = `<div class="loading">Cargando cajas...</div>`;
      try {
        const url = `${API_URL}?action=getCajasRegistradas`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          throw new Error(data.message || 'Error al cargar cajas');
        }

        cajasGlobal = data.cajas || [];
        cargarSupervisores(data.supervisores || []);

        pintarTabla();

      } catch (err) {
        contenedor.innerHTML = `<div class="loading">Error: ${err.message}</div>`;
      }
    }

    function cargarSupervisores(supervisores) {
      const select = document.getElementById('filtroSupervisor');
      const valorActual = select.value;

      select.innerHTML = `<option value="">Todos los supervisores</option>`;

      supervisores.forEach(sup => {
        const option = document.createElement('option');
        option.value = sup;
        option.textContent = sup;
        select.appendChild(option);
      });

      select.value = valorActual;
    }

function pintarTabla() {
  const contenedor = document.getElementById('contenedorCajas');
  const supervisor = document.getElementById('filtroSupervisor').value;
  const estadoFiltro = document.getElementById('filtroEstado').value;
  const texto = document.getElementById('buscarTexto').value.toLowerCase().trim();

  let data = cajasGlobal.slice();

  data = data.filter(x => x.idRegistro && x.estado);



  data.sort((a, b) => {
    const orden = {
      PENDIENTE: 1,
      OBSERVADO: 2,
      APROBADO: 3,
      DEVUELTO: 4
    };

    const estadoA = (a.estado || '').toUpperCase();
    const estadoB = (b.estado || '').toUpperCase();

    return (orden[estadoA] || 99) - (orden[estadoB] || 99);
  });

  if (supervisor) {
    data = data.filter(x => x.supervisor === supervisor);
  }

  if (estadoFiltro) {
    data = data.filter(x => (x.estado || '').toUpperCase() === estadoFiltro);
  }

  if (texto) {
    data = data.filter(x => {
      return [
        x.caja,
        x.idRegistro,
        x.responsable,
        x.supervisor,
        x.servicio,
        x.fecha,
        x.estado
      ].join(' ').toLowerCase().includes(texto);
    });
  }

    actualizarResumen(data);
    
    if (!data.length) {
      contenedor.innerHTML = `<div class="loading">No hay cajas para mostrar</div>`;
      return;
    }
  contenedor.innerHTML = data.map(item => {
    const claseEstado = (item.estado || '').toLowerCase();
    const cajaLimpia = extraerCaja(item.caja);

    return `
      <div class="card-caja ${claseEstado}">
        <div class="card-head">
          <div class="card-img-box">
            <img src="img/CajaHerramientasdeplácticoTRUPPER.JPG" alt="Caja de herramientas">
          </div>

          <div class="card-title">
            <h3>CAJA ${cajaLimpia}</h3>
            <small>${item.idRegistro || '-'}</small>
          </div>
        </div>

        <div>${badgeEstado(item.estado)}</div>

        <div class="card-info-grid">
          <div class="card-info">
            <strong>👷 Responsable</strong>
            ${item.responsable || '-'}
          </div>

          <div class="card-info">
            <strong>👨‍💼 Supervisor</strong>
            ${item.supervisor || '-'}
          </div>

          <div class="card-info">
            <strong>🏭 Unidad</strong>
            ${item.unidad || '-'}
          </div>

          <div class="card-info">
            <strong>🔧 Servicio</strong>
            ${item.servicio || '-'}
          </div>

          <div class="card-info">
            <strong>📅 Fecha</strong>
            ${item.fecha || '-'}
          </div>

          <div class="card-info">
            <strong>🕒 Turno</strong>
            ${item.turno || '-'}
          </div>
        </div>

        <div class="card-actions">
          <button onclick="verRegistro('${item.idRegistro}')">🔍 Revisar caja</button>
        </div>
      </div>
    `;
  }).join('');
}


    function actualizarResumen(data) {
  const contar = estado => data.filter(x => (x.estado || '').toUpperCase() === estado).length;

  document.getElementById('totalPendientes').textContent = contar('PENDIENTE');
  document.getElementById('totalAprobadas').textContent = contar('APROBADO');
  document.getElementById('totalObservadas').textContent = contar('OBSERVADO');
  document.getElementById('totalDevueltas').textContent = contar('DEVUELTO');
}

    function extraerCaja(textoCaja) {
  const texto = textoCaja || '';

  const codigo = texto.match(/CODIGO:\s*([^|]+)/i);
  if (codigo && codigo[1].trim() && codigo[1].trim() !== 'S/C') {
    return codigo[1].trim();
  }

  const serie = texto.match(/SERIE:\s*([^|]+)/i);
  if (serie && serie[1].trim() && serie[1].trim() !== 'S/S') {
    return serie[1].trim();
  }

  return texto || '-';
}
    function badgeEstado(estado) {
      const e = (estado || '').toUpperCase();

      if (e === 'PENDIENTE') {
        return `<span class="badge pendiente">PENDIENTE</span>`;
      }

      if (e === 'APROBADO') {
        return `<span class="badge aprobado">APROBADO</span>`;
      }

      if (e === 'OBSERVADO') {
        return `<span class="badge observado">OBSERVADO</span>`;
      }
      if (e === 'DEVUELTO') {
        return `<span class="badge vacio">DEVUELTO</span>`;
      }

      return `<span class="badge vacio">SIN ESTADO</span>`;
    }

    async function verRegistro(idRegistro, fila) {
      try {
        let url = '';

        if (idRegistro) {
          url = `${API_URL}?action=getDetalleRegistro&idRegistro=${encodeURIComponent(idRegistro)}`;
        } else {
          alert('Este registro antiguo todavía no tiene ID REGISTRO. Luego podemos habilitar búsqueda por fila.');
          return;
        }

        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          throw new Error(data.message || 'No se pudo obtener el detalle');
        }

        mostrarDetalle(data.detalle);

      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

function mostrarDetalle(detalle) {
  const contenedor = document.getElementById('detalleRegistro');

  const caja = extraerCaja(detalle['Caja Herramientas de pláctico TRUPPER'] || '');
  const id = detalle['ID REGISTRO'] || '';

  document.getElementById('tituloModal').textContent = `Revisión de caja ${caja}`;
  document.getElementById('subtituloModal').textContent = id;

  const herramientas = [
    'Arnés Mecánico 6 argollas Talla: _______',
    'Arnés Mecánico 4 argollas Talla: _______',
    'Balde lainero de lona HAUK',
    'Bloque Retráctil HALT MIKRON ONEBLOCK CI DE 2M MODELO MIC02_69 (1)',
    'Bloque Retráctil HALT MIKRON ONEBLOCK CI DE 2M MODELO MIC02_69 (2)',
    'Cabo en Y con amortiguador de impacto',
    'Cabo en Y sin amortiguador de impacto',
    'Caja Herramientas de pláctico TRUPPER',
    'Correaje de Andamiero',
    'Faja Anclaje MSA doble argolla 0.9m',
    'Faja Anclaje MSAdoble argolla 1.8M',
    'Flexometro de 5m',
    'Flexometro de 8m',
    'Hombrera de cuero',
    'Kit Antitrauma MSA Model 10063431 (1)',
    'Kit Antitrauma MSA Model 10063431 (2)',
    'Llave Carraca ALFMAN QLF-RW 1922',
    'Llave Francesa 12"',
    'Llave Francesa 8"',
    'Llave Mixta 22mm',
    'Martillo Andamiero ALFMAN ACF H0075',
    'Nivel de Mano STANLEY 9"',
    'Rodillera',
    'Polea con Freno SECURPULLEY'
  ];

  const herramientasHtml = herramientas
    .filter(h => detalle[h])
    .map(h => `
      <div class="herramienta-item">
        <strong>${h}</strong>
        <span>${detalle[h]}</span>
      </div>
    `).join('');

  contenedor.innerHTML = `
    <div class="seccion-detalle">
      <h3>Datos generales</h3>
      <div class="detalle-grid">
        ${itemDetalle('ID Registro', detalle['ID REGISTRO'])}
        ${itemDetalle('Estado', detalle['ESTADO'])}
        ${itemDetalle('Fecha', detalle['FECHA:'])}
        ${itemDetalle('Unidad', detalle['UNIDAD MINERA:'])}
        ${itemDetalle('Servicio', detalle['SERVICIO'])}
        ${itemDetalle('Turno', detalle['TURNO:'])}
        ${itemDetalle('Responsable', detalle['ANDAMIERO RESPONSABLE'])}
        ${itemDetalle('Documento responsable', detalle['DOCUMENTO RESPONSABLE:'])}
        ${itemDetalle('Supervisor', detalle['SUPERVISOR A CARGO:'])}
        ${itemDetalle('Documento supervisor', detalle['DOCUMENTO SUPERVISOR:'])}
      </div>
    </div>

    <div class="seccion-detalle">
      <h3>Herramientas registradas</h3>
      ${herramientasHtml || '<div class="loading">No hay herramientas registradas.</div>'}
    </div>
  `;

  document.getElementById('modalDetalle').style.display = 'block';
}

function itemDetalle(titulo, valor) {
  return `
    <div class="detalle-item">
      <strong>${titulo}</strong>
      <span>${valor || '-'}</span>
    </div>
  `;
}

    function cerrarModal() {
      document.getElementById('modalDetalle').style.display = 'none';
    }
  </script>
</body>
</html>
