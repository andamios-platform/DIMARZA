<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Supervisor - Herramientas</title> 

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

.top-header {
  background: linear-gradient(135deg, #111827, #1f2937);
  color: white;
  padding: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: left;
  box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

.logo-dimarza {
  width: 90px;
  height: 90px;
  object-fit: contain;
  background: white;
  border-radius: 16px;
  padding: 8px;
}

.top-header h1 {
  margin: 0;
  font-size: 30px;
}

.top-header p {
  margin: 6px 0 0;
  color: #d1d5db;
}

    .container {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    label {
      font-weight: bold;
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.stat {
  background: white;
  padding: 16px 18px;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  border-left: 6px solid #2563eb;
}
    .revision-buttons.tres {
  grid-template-columns: 1fr 1fr 1fr;
}

.btn-devolver {
  background: #374151;
}

.btn-devolver:hover {
  background: #1f2937;
}

.stat strong {
  display: block;
  font-size: 26px;
  color: #111827;
}

.stat span {
  font-size: 14px;
  color: #4b5563;
}

.stat.pendiente {
  border-left-color: #f59e0b;
}

.stat.aprobado {
  border-left-color: #16a34a;
}

.stat.observado {
  border-left-color: #dc2626;
}

.stat.devuelto {
  border-left-color: #374151;
}

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .pendiente {
      background: #fef3c7;
      color: #92400e;
    }

    .aprobado {
      background: #dcfce7;
      color: #166534;
    }

    .observado {
      background: #fee2e2;
      color: #991b1b;
    }

    .vacio {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-ver {
      background: #111827;
      padding: 8px 12px;
      font-size: 13px;
    }

    .btn-ver:hover {
      background: #374151;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-weight: bold;
    }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 1000;
  padding: 24px;
}

.modal-revision {
  background: #f9fafb;
  width: min(1200px, 96vw);
  max-height: 92vh;
  margin: auto;
  border-radius: 24px;
  padding: 24px;
  overflow-y: auto;
  box-shadow: 0 25px 80px rgba(0,0,0,0.35);
}

.modal-header {
  background: #111827;
  color: white;
  border-radius: 18px;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  font-size: 24px;
}

.modal-header p {
  margin: 5px 0 0;
  color: #d1d5db;
}

.close {
  background: #dc2626;
}

.seccion-detalle {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.seccion-detalle h3 {
  margin: 0 0 14px;
  font-size: 18px;
  color: #111827;
}

.detalle-grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:12px;
}

.detalle-item{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:10px;
    text-align:center;
    min-width:0;
}

.detalle-item strong{
    display:block;
    font-size:10px;
    color:#6b7280;
    margin-bottom:4px;
    font-weight:600;
}

.detalle-item span{
    display:block;
    font-size:13px;
    color:#111827;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.herramienta-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
  margin-bottom: 8px;
}
.herramienta-item::before {
  content: "✓";
  color: #16a34a;
  font-weight: bold;
  margin-right: 8px;
}

.herramienta-item strong {
  color: #111827;
}

.herramienta-item span {
  color: #374151;
  font-size: 13px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 22px;
}

.card-caja {
  background: white;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.09);
  border-left: 8px solid #f59e0b;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
    .card-caja{
    position:relative;
}

.card-caja::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    border-radius:22px 22px 0 0;
    background:#f59e0b;
}

.card-caja:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 35px rgba(0,0,0,0.12);
}
.card-caja:hover .card-img-box img{
    transform:scale(1.06);
}

.card-caja.aprobado {
  border-left-color: #16a34a;
}
    .card-caja.aprobado::before{
    background:#16a34a;
}

.card-caja.observado {
  border-left-color: #dc2626;
}
    .card-caja.observado::before{
    background:#dc2626;
}

.card-caja.devuelto {
  border-left-color: #374151;
}
    .card-caja.devuelto::before{
    background:#374151;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.card-img-box {
  width: 82px;
  height: 82px;
  border-radius: 18px;
  background: #f9fafb;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #e5e7eb;
}

.card-img-box img{
    width:90%;
    height:90%;
    object-fit:contain;
    transition:.25s;
}

.card-title h3 {
  margin: 0;
  font-size: 24px;
  color: #92400e;
}

.card-title small {
  color: #6b7280;
  font-size: 12px;
}

.card-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.card-info {
  background: #f9fafb;
  border-radius: 12px;
  padding: 10px;
  font-size: 13px;
  color: #374151;
}

.card-info strong {
  display: block;
  color: #111827;
  font-size: 12px;
  margin-bottom: 4px;
}

.card-id {
  margin-top: 12px;
  font-size: 12px;
  color: #6b7280;
  word-break: break-all;
}

.card-actions {
  margin-top: 18px;
}

.card-actions button {
  width: 100%;
  background:#f97316;
  padding: 13px;
  font-size: 14px;
}

.card-actions button:hover {
  background:#ea580c;
}

    .revision-actions {
  background: white;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.revision-actions label {
  margin-bottom: 8px;
}

.revision-actions textarea,
.revision-actions input,
.revision-actions select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 14px;
  margin-bottom: 12px;
}


.revision-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-aprobar {
  background: #16a34a;
}

.btn-aprobar:hover {
  background: #15803d;
}

.btn-observar {
  background: #dc2626;
}

.btn-observar:hover {
  background: #b91c1c;
}
    .toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #111827;
  color: white;
  padding: 14px 18px;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  z-index: 3000;
  display: none;
  font-weight: bold;
}

.toast.ok {
  background: #16a34a;
}

.toast.error {
  background: #dc2626;
}

.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 2500;
  align-items: center;
  justify-content: center;
}

.confirm-box {
  background: white;
  width: min(420px, 92vw);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.confirm-box h3 {
  margin: 0 0 10px;
  font-size: 22px;
}

.confirm-box p {
  color: #4b5563;
  margin-bottom: 20px;
}

.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-cancelar {
  background: #6b7280;
}

.btn-confirmar {
  background: #f97316;
}
.tabla-comparativo {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.tabla-comparativo th,
.tabla-comparativo td {
  border: 1px solid #e5e7eb;
  padding: 10px;
  text-align: left;
}
.tabla-comparativo td:first-child{
    text-align:center;
    vertical-align:middle;
}
.estado-celda{
    text-align:center !important;
    vertical-align:middle;
    white-space:nowrap;
}

.estado-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
    font-weight:600;
}

.estado-ok{
    color:#15803d;
}

.estado-codigo{
    color:#c2410c;
}

.estado-serie{
    color:#a16207;
}

.estado-error{
    color:#dc2626;
}

.estado-falta{
    color:#6b7280;
}

.tabla-comparativo th {
  background: #111827;
  color: white;
}
.tabla-comparativo td:nth-child(2){
    font-weight:600;
    color:#111827;
}

.fila-ok {
  background: #ecfdf5;
}

.fila-error {
  background: #fef2f2;
}

.estado-comp {
  text-align: center !important;
  font-size: 18px;
  font-weight: bold;
}
.dato-comp{
    display:inline-flex;
    flex-direction:column;
    align-items:flex-start;
    gap:5px;
    padding:8px 12px;
    border-radius:10px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    line-height:1.4;
    text-align:left;
}

.dato-comp div{
    display:grid;
    grid-template-columns:65px auto;
    align-items:center;
    column-gap:8px;
    width:100%;
}

.dato-comp strong{
    color:#374151;
    font-weight:600;
    text-align:left;
}

.dato-comp span{
    text-align:left;
}
.tabla-comparativo td{
    vertical-align:middle;
}

.tabla-comparativo th{
    vertical-align:middle;
}

.tabla-comparativo th:last-child,
.tabla-comparativo td:last-child{
    width:160px;
    text-align:center;
}
/* FOTO */
.tabla-comparativo th:nth-child(1),
.tabla-comparativo td:nth-child(1){
    width:140px;
    text-align:center;
    vertical-align:middle;
}

/* HERRAMIENTA */
.tabla-comparativo th:nth-child(2),
.tabla-comparativo td:nth-child(2){
    width:420px;
    text-align:left;
    vertical-align:middle;
}

/* REGISTRADO */
.tabla-comparativo th:nth-child(3),
.tabla-comparativo td:nth-child(3){
    width:210px;
    text-align:center;
    vertical-align:middle;
}

/* ESPERADO */
.tabla-comparativo th:nth-child(4),
.tabla-comparativo td:nth-child(4){
    width:210px;
    text-align:center;
    vertical-align:middle;
}

/* ESTADO */
.tabla-comparativo th:nth-child(5),
.tabla-comparativo td:nth-child(5){
    width:150px;
    text-align:center;
    vertical-align:middle;
}
.resumen-comparativo{
    display:grid;
    grid-template-columns:repeat(3, minmax(150px, 1fr));
    gap:12px;
    margin-bottom:16px;
}

.resumen-item{
    appearance:none;
    width:100%;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
}

.resumen-item:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 18px rgba(0,0,0,.09);
}

.resumen-item strong{
    display:block;
    font-size:32px;
    line-height:1;
    font-weight:700;
    margin-bottom:7px;
}

.resumen-item span{
    display:block;
    font-size:13px;
    font-weight:700;
}

.resumen-item small{
    display:block;
    margin-top:5px;
    color:#6b7280;
    font-size:11px;
    font-weight:500;
}

.resumen-ok{
    border-top:5px solid #16a34a;
}

.resumen-diferencia{
    border-top:5px solid #ea580c;
}

.resumen-falta{
    border-top:5px solid #6b7280;
}

.resumen-ok strong,
.resumen-ok span{
    color:#15803d;
}

.resumen-diferencia strong,
.resumen-diferencia span{
    color:#c2410c;
}


.progreso-comparativo{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
}

.progreso-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
}

.progreso-texto{
    font-size:14px;
    font-weight:700;
    color:#111827;
}

.progreso-porcentaje{
    font-size:24px;
    font-weight:800;
}

.progreso-fondo{
    width:100%;
    height:14px;
    border-radius:999px;
    overflow:hidden;
    background:#e5e7eb;
}

.progreso-barra{
    height:100%;
    border-radius:999px;
    transition:width .4s ease;
}

.progreso-verde{
    background:#16a34a;
    color:#15803d;
}

.progreso-amarillo{
    background:#f59e0b;
    color:#b45309;
}

.progreso-rojo{
    background:#dc2626;
    color:#b91c1c;
}

.btn-mostrar-todos{
    margin-top:12px;
    padding:8px 13px;
    border-radius:9px;
    background:#111827;
    font-size:12px;
}

.btn-mostrar-todos:hover{
    background:#374151;
}

.resumen-ok.activo{
    background:#ecfdf5;
    box-shadow:0 0 0 3px rgba(22,163,74,.20);
}

.resumen-diferencia.activo{
    background:#fff7ed;
    box-shadow:0 0 0 3px rgba(234,88,12,.20);
}

.resumen-falta.activo{
    background:#f3f4f6;
    box-shadow:0 0 0 3px rgba(107,114,128,.20);
}
.aviso-filtro{
    display:none;
    margin-bottom:14px;
    padding:11px 14px;
    border-radius:10px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    font-size:13px;
    font-weight:700;
    text-align:center;
}

.aviso-filtro.visible{
    display:block;
}


.texto-progreso-verde{
    color:#15803d;
}

.texto-progreso-amarillo{
    color:#b45309;
}

.texto-progreso-rojo{
    color:#b91c1c;
}

.detalle-item strong{
    display:block;
    font-size:10px;
    color:#6b7280;
    margin-bottom:4px;
    font-weight:600;
}

.detalle-item span{
    display:block;
    font-size:13px;
    color:#111827;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
  </style>
</head>

<body>
  <header class="top-header">
  <img src="img/mini-logo.png" alt="DIMARZA" class="logo-dimarza">
  <div>
    <h1>Control Supervisor</h1>
    <p>Sistema de gestión de herramientas</p>
  </div>
</header>

  <div class="container">
    <div class="panel">
      <div class="filters">
        <div>
          <label for="filtroSupervisor">Filtrar por supervisor</label>
          <select id="filtroSupervisor">
            <option value="">Todos los supervisores</option>
          </select>
        </div>
        <div>
          <label for="filtroEstado">Filtrar por estado</label>
          <select id="filtroEstado">
            <option value="">Todos los estados</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="APROBADO">Aprobado</option>
            <option value="OBSERVADO">Observado</option>
            <option value="DEVUELTO">Devuelto</option>
          </select>
        </div>
        <div>
          <label for="buscarTexto">Buscar</label>
          <input id="buscarTexto" type="text" placeholder="Caja, responsable, servicio o ID">
        </div>

        <div>
          <button onclick="cargarCajas()">Actualizar</button>
        </div>
      </div>
    </div>

    <div class="stats">
  <div class="stat pendiente">
    <strong id="totalPendientes">0</strong>
    <span>🟡 Pendientes</span>
  </div>

  <div class="stat aprobado">
    <strong id="totalAprobadas">0</strong>
    <span>🟢 Aprobadas</span>
  </div>

  <div class="stat observado">
    <strong id="totalObservadas">0</strong>
    <span>🔴 Observadas</span>
  </div>

  <div class="stat devuelto">
    <strong id="totalDevueltas">0</strong>
    <span>⚫ Devueltas</span>
  </div>
</div>

    <div id="contenedorCajas" class="cards-grid">
  <div class="loading">Cargando cajas...</div>
</div>
  </div>

<div id="modalDetalle" class="modal">
  <div class="modal-content modal-revision">
    <div class="modal-header">
      <div>
        <h2 id="tituloModal">Revisión de caja</h2>
        <p id="subtituloModal">Detalle del registro seleccionado</p>
      </div>
      <button class="close" onclick="cerrarModal()">Cerrar</button>
    </div>

    <div id="detalleRegistro"></div>
  </div>
</div>

  <script>

    const API_URL = 'https://script.google.com/macros/s/AKfycbwbL9jVD3zWZUdrD71aD6rvL-VQy3wYVcvHeunoYF1CjdCDYyNnYw-WsXx52GRlnEn8/exec';

    let cajasGlobal = [];
    let idRegistroActual = '';
    let supervisoresRevision = [];
    
    let comparativoActual = [];
    let filtroComparativoActual = 'TODOS';

    document.addEventListener('DOMContentLoaded', () => {
      cargarCajas();

      document.getElementById('filtroSupervisor').addEventListener('change', pintarTabla);
      document.getElementById('filtroEstado').addEventListener('change', pintarTabla);
      document.getElementById('buscarTexto').addEventListener('input', pintarTabla);
    });

    async function cargarCajas() {
      const contenedor = document.getElementById('contenedorCajas');
      contenedor.innerHTML = `<div class="loading">Cargando cajas...</div>`;
      try {
        const url = `${API_URL}?action=getCajasRegistradas`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          throw new Error(data.message || 'Error al cargar cajas');
        }

        cajasGlobal = data.cajas || [];
        cargarSupervisores(data.supervisores || []);
        
        try {
          await cargarSupervisoresRevision();
        } catch (e) {
          console.warn('No se pudieron cargar supervisores de revisión:', e);
        }
        
        pintarTabla();

      } catch (err) {

    function extraerCaja(textoCaja) {
  const texto = textoCaja || '';

  const codigo = texto.match(/CODIGO:\s*([^|]+)/i);
  if (codigo && codigo[1].trim() && codigo[1].trim() !== 'S/C') {
    return codigo[1].trim();
  }

  const serie = texto.match(/SERIE:\s*([^|]+)/i);
  if (serie && serie[1].trim() && serie[1].trim() !== 'S/S') {
    return serie[1].trim();
  }

  return texto || '-';
}

function formatoComparativo(texto, estado = '', tipo = '') {

  const t = texto || '-';

  const codigo = t.match(/CODIGO:\s*([^|]+)/i);
  const serie = t.match(/SERIE:\s*([^|]+)/i);

  if (t === 'S/C') {
    return `
      <div class="dato-comp">
        <div><strong>Código</strong> S/C</div>
        <div><strong>Serie</strong> S/S</div>
      </div>
    `;
  }

  if (!codigo && !serie) {
    return t;
  }

  const cod = codigo ? codigo[1].trim() : 'S/C';
  const ser = serie ? serie[1].trim() : 'S/S';

  const marcarCodigo = tipo === 'registrado' && (estado === 'CODIGO' || estado === 'AMBOS');
  const marcarSerie = tipo === 'registrado' && (estado === 'SERIE' || estado === 'AMBOS');

  return `
    <div class="dato-comp">
      <div>
        <strong>Código</strong>
        ${marcarCodigo
          ? `<span style="color:#dc2626;font-weight:bold;">${cod}</span>`
          : cod}
      </div>
      <div>
        <strong>Serie</strong>
        ${marcarSerie
          ? `<span style="color:#dc2626;font-weight:bold;">${ser}</span>`
          : ser}
      </div>
    </div>
  `;
}
function generarFilasComparativo(lista) {
  if (!lista || !lista.length) {
    return `
      <tr>
        <td colspan="5" style="text-align:center;padding:25px;">
          No hay herramientas para mostrar.
        </td>
      </tr>
    `;
  }

  return lista.map(x => {
    let icono = '';
    let clase = '';

    switch (x.estado) {
      case 'OK':
        icono = '✅';
        clase = 'estado-ok';
        break;

      case 'CODIGO':
        icono = '🟠';
        clase = 'estado-codigo';
        break;

      case 'SERIE':
        icono = '🟡';
        clase = 'estado-serie';
        break;

      case 'AMBOS':
        icono = '❌';
        clase = 'estado-error';
        break;

      case 'NO_REGISTRADO':
        icono = '⚪';
        clase = 'estado-falta';
        break;

      default:
        icono = '—';
        clase = 'estado-falta';
    }

    return `
      <tr>
        <td>
          <img
            class="herramienta-img"
            src="${imagenHerramienta(x.herramienta)}"
            alt="${x.herramienta}"
            onerror="this.src='img/CajaHerramientasdeplácticoTRUPPER.JPG'">
        </td>

        <td>${x.herramienta}</td>

        <td>
          ${formatoComparativo(
            x.registrado,
            x.estado,
            'registrado'
          )}
        </td>

        <td>
          ${formatoComparativo(
            x.esperado,
            x.estado,
            'esperado'
          )}
        </td>

        <td class="estado-celda">
          <span class="estado-badge ${clase}">
            ${icono} ${x.descripcion}
          </span>
        </td>
      </tr>
    `;
  }).join('');
}
function filtrarComparativo(tipo) {
  const tbody = document.getElementById('tbodyComparativo');
  const aviso = document.getElementById('avisoFiltroComparativo');

  if (!tbody) return;

  filtroComparativoActual = tipo;

  let listaFiltrada = comparativoActual;
  let mensaje = '';

  if (tipo === 'OK') {
    listaFiltrada = comparativoActual.filter(
      x => x.estado === 'OK'
    );

    mensaje = 'Mostrando únicamente herramientas que coinciden.';
  }

  if (tipo === 'DIFERENCIAS') {
    listaFiltrada = comparativoActual.filter(
      x => ['CODIGO', 'SERIE', 'AMBOS'].includes(x.estado)
    );

    mensaje = 'Mostrando únicamente herramientas con diferencias.';
  }

  if (tipo === 'NO_REGISTRADO') {
    listaFiltrada = comparativoActual.filter(
      x => x.estado === 'NO_REGISTRADO'
    );

    mensaje = 'Mostrando únicamente herramientas no registradas.';
  }

  if (tipo === 'TODOS') {
    listaFiltrada = comparativoActual;
    mensaje = '';
  }

  tbody.innerHTML = generarFilasComparativo(listaFiltrada);

  marcarResumenActivo(tipo);

  if (aviso) {
    aviso.textContent = mensaje;
    aviso.classList.toggle('visible', tipo !== 'TODOS');
  }
}
function marcarResumenActivo(tipo) {
  const tarjetas = {
    OK: document.getElementById('resumenOK'),
    DIFERENCIAS: document.getElementById('resumenDiferencias'),
    NO_REGISTRADO: document.getElementById('resumenNoRegistradas')
  };

  Object.values(tarjetas).forEach(tarjeta => {
    if (tarjeta) tarjeta.classList.remove('activo');
  });

  if (tarjetas[tipo]) {
    tarjetas[tipo].classList.add('activo');
  }
}

function actualizarRevision(action) {
  const revisadoPor = document.getElementById('revisadoPor').value.trim();
  const observacion = document.getElementById('observacionSupervisor').value.trim();

  if (!idRegistroActual) {
    mostrarToast('No se encontró el ID del registro.', 'error');
    return;
  }

  if (!revisadoPor) {
    mostrarToast('Seleccione el supervisor que revisa o recibe.', 'error');
    return;
  }

  if (action === 'observarRegistro' && !observacion) {
    mostrarToast('Para observar debes ingresar una observación.', 'error');
    return;
  }

  const config = {
    aprobarRegistro: {
      titulo: 'Aprobar entrega',
      mensaje: 'La caja pasará al estado APROBADO.',
      textoBoton: 'Aprobar'
    },
    observarRegistro: {
      titulo: 'Observar entrega',
      mensaje: 'La caja pasará al estado OBSERVADO.',
      textoBoton: 'Observar'
    },
    registrarDevolucion: {
      titulo: 'Registrar devolución',
      mensaje: 'La caja pasará al estado DEVUELTO.',
      textoBoton: 'Registrar'
    }
  };

  abrirConfirmacion(config[action], async () => {
    await ejecutarRevision(action, revisadoPor, observacion);
  });
}

async function ejecutarRevision(action, revisadoPor, observacion) {
  const btn = document.getElementById('btnConfirmarAccion');

  try {
    btn.disabled = true;
    btn.textContent = 'Procesando...';

    let url =
      `${API_URL}?action=${action}` +
      `&idRegistro=${encodeURIComponent(idRegistroActual)}` +
      `&observacion=${encodeURIComponent(observacion)}`;

    if (action === 'registrarDevolucion') {
      url += `&recibidoPor=${encodeURIComponent(revisadoPor)}`;
    } else {
      url += `&revisadoPor=${encodeURIComponent(revisadoPor)}`;
    }

    const res = await fetch(url);
    const data = await res.json();

    if (!data.ok) {
      throw new Error(data.message || 'No se pudo actualizar el registro.');
    }

    cerrarConfirmacion();
    cerrarModal();
    mostrarToast(data.message, 'ok');
    await cargarCajas();

  } catch (err) {
    mostrarToast(err.message, 'error');

  } finally {
    btn.disabled = false;
    btn.textContent = 'Confirmar';
  }
}

function mostrarToast(mensaje, tipo) {
  const toast = document.getElementById('toast');
  toast.textContent = mensaje;
  toast.className = `toast ${tipo}`;
  toast.style.display = 'block';

  setTimeout(() => {
    toast.style.display = 'none';
  }, 2500);
}
    
  </script>
<div id="toast" class="toast"></div>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirmTitulo">Confirmar acción</h3>
    <p id="confirmMensaje">¿Deseas continuar?</p>

    <div class="confirm-actions">
      <button class="btn-cancelar" onclick="cerrarConfirmacion()">Cancelar</button>
      <button class="btn-confirmar" id="btnConfirmarAccion">Confirmar</button>
    </div>
  </div>
</div>
</body>
