<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Supervisor - Herramientas</title> 

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

.top-header {
  background: linear-gradient(135deg, #111827, #1f2937);
  color: white;
  padding: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: left;
  box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

.logo-dimarza {
  width: 90px;
  height: 90px;
  object-fit: contain;
  background: white;
  border-radius: 16px;
  padding: 8px;
}

.top-header h1 {
  margin: 0;
  font-size: 30px;
}

.top-header p {
  margin: 6px 0 0;
  color: #d1d5db;
}

    .container {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    label {
      font-weight: bold;
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.stat {
  background: white;
  padding: 16px 18px;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  border-left: 6px solid #2563eb;
}
    .revision-buttons.tres {
  grid-template-columns: 1fr 1fr 1fr;
}

.btn-devolver {
  background: #374151;
}

.btn-devolver:hover {
  background: #1f2937;
}

.stat strong {
  display: block;
  font-size: 26px;
  color: #111827;
}

.stat span {
  font-size: 14px;
  color: #4b5563;
}

.stat.pendiente {
  border-left-color: #f59e0b;
}

.stat.aprobado {
  border-left-color: #16a34a;
}

.stat.observado {
  border-left-color: #dc2626;
}

.stat.devuelto {
  border-left-color: #374151;
}

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .pendiente {
      background: #fef3c7;
      color: #92400e;
    }

    .aprobado {
      background: #dcfce7;
      color: #166534;
    }

    .observado {
      background: #fee2e2;
      color: #991b1b;
    }

    .vacio {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-ver {
      background: #111827;
      padding: 8px 12px;
      font-size: 13px;
    }

    .btn-ver:hover {
      background: #374151;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-weight: bold;
    }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 1000;
  padding: 24px;
}

.modal-revision {
  background: #f9fafb;
  width: min(1200px, 96vw);
  max-height: 92vh;
  margin: auto;
  border-radius: 24px;
  padding: 24px;
  overflow-y: auto;
  box-shadow: 0 25px 80px rgba(0,0,0,0.35);
}

.modal-header {
  background: #111827;
  color: white;
  border-radius: 18px;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  font-size: 24px;
}

.modal-header p {
  margin: 5px 0 0;
  color: #d1d5db;
}

.close {
  background: #dc2626;
}

.seccion-detalle {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.seccion-detalle h3 {
  margin: 0 0 14px;
  font-size: 18px;
  color: #111827;
}

.detalle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.detalle-item {
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
}

.detalle-item strong {
  display: block;
  font-size: 12px;
  color: #374151;
  margin-bottom: 5px;
}

.detalle-item span {
  font-size: 14px;
  color: #111827;
}

.herramienta-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
  margin-bottom: 8px;
}
.herramienta-item::before {
  content: "✓";
  color: #16a34a;
  font-weight: bold;
  margin-right: 8px;
}

.herramienta-item strong {
  color: #111827;
}

.herramienta-item span {
  color: #374151;
  font-size: 13px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 22px;
}

.card-caja {
  background: white;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.09);
  border-left: 8px solid #f59e0b;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
    .card-caja{
    position:relative;
}

.card-caja::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    border-radius:22px 22px 0 0;
    background:#f59e0b;
}

.card-caja:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 35px rgba(0,0,0,0.12);
}
.card-caja:hover .card-img-box img{
    transform:scale(1.06);
}

.card-caja.aprobado {
  border-left-color: #16a34a;
}
    .card-caja.aprobado::before{
    background:#16a34a;
}

.card-caja.observado {
  border-left-color: #dc2626;
}
    .card-caja.observado::before{
    background:#dc2626;
}

.card-caja.devuelto {
  border-left-color: #374151;
}
    .card-caja.devuelto::before{
    background:#374151;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.card-img-box {
  width: 82px;
  height: 82px;
  border-radius: 18px;
  background: #f9fafb;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #e5e7eb;
}

.card-img-box img{
    width:90%;
    height:90%;
    object-fit:contain;
    transition:.25s;
}

.card-title h3 {
  margin: 0;
  font-size: 24px;
  color: #92400e;
}

.card-title small {
  color: #6b7280;
  font-size: 12px;
}

.card-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.card-info {
  background: #f9fafb;
  border-radius: 12px;
  padding: 10px;
  font-size: 13px;
  color: #374151;
}

.card-info strong {
  display: block;
  color: #111827;
  font-size: 12px;
  margin-bottom: 4px;
}

.card-id {
  margin-top: 12px;
  font-size: 12px;
  color: #6b7280;
  word-break: break-all;
}

.card-actions {
  margin-top: 18px;
}

.card-actions button {
  width: 100%;
  background:#f97316;
  padding: 13px;
  font-size: 14px;
}

.card-actions button:hover {
  background:#ea580c;
}

    .revision-actions {
  background: white;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.revision-actions label {
  margin-bottom: 8px;
}

.revision-actions textarea,
.revision-actions input,
.revision-actions select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 14px;
  margin-bottom: 12px;
}

.revision-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-aprobar {
  background: #16a34a;
}

.btn-aprobar:hover {
  background: #15803d;
}

.btn-observar {
  background: #dc2626;
}

.btn-observar:hover {
  background: #b91c1c;
}
    .herramientas-tabla {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.herramienta-row {
  display: grid;
  grid-template-columns: 58px 1fr auto;
  gap: 12px;
  align-items: center;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 10px 12px;
}

.herramienta-img {
  width: 58px;
  height: 58px;
  border-radius: 12px;
  background: white;
  object-fit: contain;
  padding: 5px;
  border: 1px solid #e5e7eb;
}

.herramienta-nombre {
  font-weight: bold;
  color: #111827;
  font-size: 14px;
}

.herramienta-valor {
  color: #374151;
  font-size: 13px;
  margin-top: 4px;
}

.herramienta-check {
  color: #16a34a;
  font-weight: bold;
  font-size: 18px;
}

    .toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #111827;
  color: white;
  padding: 14px 18px;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  z-index: 3000;
  display: none;
  font-weight: bold;
}

.toast.ok {
  background: #16a34a;
}

.toast.error {
  background: #dc2626;
}

.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 2500;
  align-items: center;
  justify-content: center;
}

.confirm-box {
  background: white;
  width: min(420px, 92vw);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.confirm-box h3 {
  margin: 0 0 10px;
  font-size: 22px;
}

.confirm-box p {
  color: #4b5563;
  margin-bottom: 20px;
}

.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-cancelar {
  background: #6b7280;
}

.btn-confirmar {
  background: #f97316;
}
    @media (max-width: 800px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .detalle-grid {
        grid-template-columns: 1fr;
    }  
      .revision-buttons.tres {
      grid-template-columns: 1fr;
    }
    }
  </style>
</head>

<body>
  <header class="top-header">
  <img src="img/mini-logo.png" alt="DIMARZA" class="logo-dimarza">
  <div>
    <h1>Control Supervisor</h1>
    <p>Sistema de gestión de herramientas</p>
  </div>
</header>

  <div class="container">
    <div class="panel">
      <div class="filters">
        <div>
          <label for="filtroSupervisor">Filtrar por supervisor</label>
          <select id="filtroSupervisor">
            <option value="">Todos los supervisores</option>
          </select>
        </div>
        <div>
          <label for="filtroEstado">Filtrar por estado</label>
          <select id="filtroEstado">
            <option value="">Todos los estados</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="APROBADO">Aprobado</option>
            <option value="OBSERVADO">Observado</option>
            <option value="DEVUELTO">Devuelto</option>
          </select>
        </div>
        <div>
          <label for="buscarTexto">Buscar</label>
          <input id="buscarTexto" type="text" placeholder="Caja, responsable, servicio o ID">
        </div>

        <div>
          <button onclick="cargarCajas()">Actualizar</button>
        </div>
      </div>
    </div>

    <div class="stats">
  <div class="stat pendiente">
    <strong id="totalPendientes">0</strong>
    <span>🟡 Pendientes</span>
  </div>

  <div class="stat aprobado">
    <strong id="totalAprobadas">0</strong>
    <span>🟢 Aprobadas</span>
  </div>

  <div class="stat observado">
    <strong id="totalObservadas">0</strong>
    <span>🔴 Observadas</span>
  </div>

  <div class="stat devuelto">
    <strong id="totalDevueltas">0</strong>
    <span>⚫ Devueltas</span>
  </div>
</div>

    <div id="contenedorCajas" class="cards-grid">
  <div class="loading">Cargando cajas...</div>
</div>
  </div>

<div id="modalDetalle" class="modal">
  <div class="modal-content modal-revision">
    <div class="modal-header">
      <div>
        <h2 id="tituloModal">Revisión de caja</h2>
        <p id="subtituloModal">Detalle del registro seleccionado</p>
      </div>
      <button class="close" onclick="cerrarModal()">Cerrar</button>
    </div>

    <div id="detalleRegistro"></div>
  </div>
</div>

  <script>

    const API_URL = 'https://script.google.com/macros/s/AKfycbyn0NkQ2TN7CBqgQmPxQDc50L00tFgAx_GtCVT1Z_L1r6y4hoAHea4Wtfx0JtMdId5G/exec';

    let cajasGlobal = [];
    let idRegistroActual = '';
    let supervisoresRevision = [];

    document.addEventListener('DOMContentLoaded', () => {
      cargarCajas();

      document.getElementById('filtroSupervisor').addEventListener('change', pintarTabla);
      document.getElementById('filtroEstado').addEventListener('change', pintarTabla);
      document.getElementById('buscarTexto').addEventListener('input', pintarTabla);
    });

    async function cargarCajas() {
      const contenedor = document.getElementById('contenedorCajas');
      contenedor.innerHTML = `<div class="loading">Cargando cajas...</div>`;
      try {
        const url = `${API_URL}?action=getCajasRegistradas`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          throw new Error(data.message || 'Error al cargar cajas');
        }

        cajasGlobal = data.cajas || [];
        await cargarSupervisoresRevision();
        cargarSupervisores(data.supervisores || []);

        pintarTabla();

      } catch (err) {
        contenedor.innerHTML = `<div class="loading">Error: ${err.message}</div>`;
      }
    }

    function cargarSupervisores(supervisores) {
      const select = document.getElementById('filtroSupervisor');
      const valorActual = select.value;

      select.innerHTML = `<option value="">Todos los supervisores</option>`;

      supervisores.forEach(sup => {
        const option = document.createElement('option');
        option.value = sup;
        option.textContent = sup;
        select.appendChild(option);
      });

      select.value = valorActual;
    }

function pintarTabla() {
  const contenedor = document.getElementById('contenedorCajas');
  const supervisor = document.getElementById('filtroSupervisor').value;
  const estadoFiltro = document.getElementById('filtroEstado').value;
  const texto = document.getElementById('buscarTexto').value.toLowerCase().trim();

  let data = cajasGlobal.slice();

  data = data.filter(x => x.idRegistro && x.estado);



  data.sort((a, b) => {
    const orden = {
      PENDIENTE: 1,
      OBSERVADO: 2,
      APROBADO: 3,
      DEVUELTO: 4
    };

    const estadoA = (a.estado || '').toUpperCase();
    const estadoB = (b.estado || '').toUpperCase();

    return (orden[estadoA] || 99) - (orden[estadoB] || 99);
  });

  if (supervisor) {
    data = data.filter(x => x.supervisor === supervisor);
  }

  if (estadoFiltro) {
    data = data.filter(x => (x.estado || '').toUpperCase() === estadoFiltro);
  }

  if (texto) {
    data = data.filter(x => {
      return [
        x.caja,
        x.idRegistro,
        x.responsable,
        x.supervisor,
        x.servicio,
        x.fecha,
        x.estado
      ].join(' ').toLowerCase().includes(texto);
    });
  }

    actualizarResumen(data);
    
    if (!data.length) {
      contenedor.innerHTML = `<div class="loading">No hay cajas para mostrar</div>`;
      return;
    }
  contenedor.innerHTML = data.map(item => {
    const claseEstado = (item.estado || '').toLowerCase();
    const cajaLimpia = extraerCaja(item.caja);

    return `
      <div class="card-caja ${claseEstado}">
        <div class="card-head">
          <div class="card-img-box">
            <img src="img/CajaHerramientasdeplácticoTRUPPER.JPG" alt="Caja de herramientas">
          </div>

          <div class="card-title">
            <h3>CAJA ${cajaLimpia}</h3>
            <small>${item.idRegistro || '-'}</small>
          </div>
        </div>

        <div>${badgeEstado(item.estado)}</div>

        <div class="card-info-grid">
          <div class="card-info">
            <strong>👷 Responsable</strong>
            ${item.responsable || '-'}
          </div>

          <div class="card-info">
            <strong>👨‍💼 Supervisor</strong>
            ${item.supervisor || '-'}
          </div>

          <div class="card-info">
            <strong>🏭 Unidad</strong>
            ${item.unidad || '-'}
          </div>

          <div class="card-info">
            <strong>🔧 Servicio</strong>
            ${item.servicio || '-'}
          </div>

          <div class="card-info">
            <strong>📅 Fecha</strong>
            ${item.fecha || '-'}
          </div>

          <div class="card-info">
            <strong>🕒 Turno</strong>
            ${item.turno || '-'}
          </div>
        </div>

        <div class="card-actions">
          <button onclick="verRegistro('${item.idRegistro}')">🔍 Revisar caja</button>
        </div>
      </div>
    `;
  }).join('');
}


    function actualizarResumen(data) {
  const contar = estado => data.filter(x => (x.estado || '').toUpperCase() === estado).length;

  document.getElementById('totalPendientes').textContent = contar('PENDIENTE');
  document.getElementById('totalAprobadas').textContent = contar('APROBADO');
  document.getElementById('totalObservadas').textContent = contar('OBSERVADO');
  document.getElementById('totalDevueltas').textContent = contar('DEVUELTO');
}

    function extraerCaja(textoCaja) {
  const texto = textoCaja || '';

  const codigo = texto.match(/CODIGO:\s*([^|]+)/i);
  if (codigo && codigo[1].trim() && codigo[1].trim() !== 'S/C') {
    return codigo[1].trim();
  }

  const serie = texto.match(/SERIE:\s*([^|]+)/i);
  if (serie && serie[1].trim() && serie[1].trim() !== 'S/S') {
    return serie[1].trim();
  }

  return texto || '-';
}
    function badgeEstado(estado) {
      const e = (estado || '').toUpperCase();

      if (e === 'PENDIENTE') {
        return `<span class="badge pendiente">PENDIENTE</span>`;
      }

      if (e === 'APROBADO') {
        return `<span class="badge aprobado">APROBADO</span>`;
      }

      if (e === 'OBSERVADO') {
        return `<span class="badge observado">OBSERVADO</span>`;
      }
      if (e === 'DEVUELTO') {
        return `<span class="badge vacio">DEVUELTO</span>`;
      }

      return `<span class="badge vacio">SIN ESTADO</span>`;
    }

    async function verRegistro(idRegistro, fila) {
      try {
        let url = '';

        if (idRegistro) {
          url = `${API_URL}?action=getDetalleRegistro&idRegistro=${encodeURIComponent(idRegistro)}`;
        } else {
          alert('Este registro antiguo todavía no tiene ID REGISTRO. Luego podemos habilitar búsqueda por fila.');
          return;
        }

        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          throw new Error(data.message || 'No se pudo obtener el detalle');
        }

        mostrarDetalle(data.detalle);

      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

async function cargarSupervisoresRevision() {
  const res = await fetch(`${API_URL}?action=getSupervisoresData`);
  const data = await res.json();

  if (data.ok) {
    supervisoresRevision = data.supervisores || [];
  }
}

function opcionesSupervisores() {
  return supervisoresRevision.map(s => `
    <option value="${s.nombre}">${s.nombre}</option>
  `).join('');
}    
function mostrarDetalle(detalle) {
  const contenedor = document.getElementById('detalleRegistro');

  const caja = extraerCaja(detalle['Caja Herramientas de pláctico TRUPPER'] || '');
  const id = detalle['ID REGISTRO'] || '';

  idRegistroActual = id;

  document.getElementById('tituloModal').textContent = `Revisión de caja ${caja}`;
  document.getElementById('subtituloModal').textContent = id;

  const herramientas = [
    'Arnés Mecánico 6 argollas Talla: _______',
    'Arnés Mecánico 4 argollas Talla: _______',
    'Balde lainero de lona HAUK',

function actualizarRevision(action) {
  const revisadoPor = document.getElementById('revisadoPor').value.trim();
  const observacion = document.getElementById('observacionSupervisor').value.trim();

  if (!idRegistroActual) {
    mostrarToast('No se encontró el ID del registro.', 'error');
    return;
  }

  if (!revisadoPor) {
    mostrarToast('Seleccione el supervisor que revisa o recibe.', 'error');
    return;
  }

  if (action === 'observarRegistro' && !observacion) {
    mostrarToast('Para observar debes ingresar una observación.', 'error');
    return;
  }

  const config = {
    aprobarRegistro: {
      titulo: 'Aprobar entrega',
      mensaje: 'La caja pasará al estado APROBADO.',
      textoBoton: 'Aprobar'
    },
    observarRegistro: {
      titulo: 'Observar entrega',
      mensaje: 'La caja pasará al estado OBSERVADO.',
      textoBoton: 'Observar'
    },
    registrarDevolucion: {
      titulo: 'Registrar devolución',
      mensaje: 'La caja pasará al estado DEVUELTO.',
      textoBoton: 'Registrar'
    }
  };

  abrirConfirmacion(config[action], async () => {
    await ejecutarRevision(action, revisadoPor, observacion);
  });
}
    function cerrarModal() {
      document.getElementById('modalDetalle').style.display = 'none';
    }

    function abrirConfirmacion(config, callback) {
  document.getElementById('confirmTitulo').textContent = config.titulo;
  document.getElementById('confirmMensaje').textContent = config.mensaje;

  const btn = document.getElementById('btnConfirmarAccion');
  btn.textContent = config.textoBoton;
  btn.onclick = callback;

  document.getElementById('confirmOverlay').style.display = 'flex';
}

function cerrarConfirmacion() {
  document.getElementById('confirmOverlay').style.display = 'none';
}

async function ejecutarRevision(action, revisadoPor, observacion) {
  const btn = document.getElementById('btnConfirmarAccion');

  try {
    btn.disabled = true;
    btn.textContent = 'Procesando...';

    let url =
      `${API_URL}?action=${action}` +
      `&idRegistro=${encodeURIComponent(idRegistroActual)}` +
      `&observacion=${encodeURIComponent(observacion)}`;

    if (action === 'registrarDevolucion') {
      url += `&recibidoPor=${encodeURIComponent(revisadoPor)}`;
    } else {
      url += `&revisadoPor=${encodeURIComponent(revisadoPor)}`;
    }

    const res = await fetch(url);
    const data = await res.json();

    if (!data.ok) {
      throw new Error(data.message || 'No se pudo actualizar el registro.');
    }

    cerrarConfirmacion();
    cerrarModal();
    mostrarToast(data.message, 'ok');
    await cargarCajas();

  } catch (err) {
    mostrarToast(err.message, 'error');
  } } finally {
  btn.disabled = false;
  btn.textContent = 'Confirmar';
}
}

function mostrarToast(mensaje, tipo) {
  const toast = document.getElementById('toast');
  toast.textContent = mensaje;
  toast.className = `toast ${tipo}`;
  toast.style.display = 'block';

  setTimeout(() => {
    toast.style.display = 'none';
  }, 2500);
}
    
  </script>
<div id="toast" class="toast"></div>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirmTitulo">Confirmar acción</h3>
    <p id="confirmMensaje">¿Deseas continuar?</p>

    <div class="confirm-actions">
      <button class="btn-cancelar" onclick="cerrarConfirmacion()">Cancelar</button>
      <button class="btn-confirmar" id="btnConfirmarAccion">Confirmar</button>
    </div>
  </div>
</div>
