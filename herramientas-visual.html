<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Herramientas</title>

<style>

   .item-card{
  border:2px solid rgba(255,255,255,0.4);
  border-radius:18px;
  padding:16px;
  background:#fff;
  transition:.2s ease;
  cursor:pointer;
  min-height:250px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  position:relative;
  color:white;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  box-shadow:var(--shadow);
}

.item-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.48);
}

.item-card > *{
  position:relative;
  z-index:1;
}

.item-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(0,0,0,0.18);
}

.item-card h3{
  margin:0 0 10px;
  font-size:15px;
  color:white;
  line-height:1.25;
  text-shadow:0 2px 6px rgba(0,0,0,0.9);
}

.item-card.open{
  aspect-ratio:auto;
  align-items:stretch;
  text-align:left;
}

.detail{
  background:white;
  color:#1f2937;
  border-radius:14px;
  padding:10px;
}

.item-card.arnes6{
  background-image:url('img/ArnésMecánico6argollas.JPG');
  background-size:contain;
  background-repeat:no-repeat;
  background-color:#0f172a;
}

.item-card.arnes4{
  background-image:url('img/ArnésMecánico4argollas.jpg');
}

.item-card.bloque{
  background-image:url('img/BloqueRetráctilSafewazeDobleLatitude-Pde1.8mGanchoEscala.JPG');
  background-size:contain;
  background-repeat:no-repeat;
  background-color:#0f172a;
}

.item-card.caboCon{
  background-image:url('img/CaboenYMSAconamortiguadordeimpacto.png');
}

.item-card.caboSin{
  background-image:url('img/Cabosinamortiguadordeimpacto.jpg');
}

.item-card.caja{
  background-image:url('img/CajaHerramientasdeplácticoTRUPPER.JPG');
  background-size:contain;
  background-repeat:no-repeat;
  background-color:#0f172a;
}

.item-card.correaje{
  background-image:url('img/CorreajedeAndamiero.JPG');
}

.item-card.faja09{
  background-image:url('img/FajaAnclajeMSAdobleargolla0.9m.jpg');
}

.item-card.faja18{
  background-image:url('img/FajaAnclajeMSAdobleargolla1.8M.JPG');
}

.item-card.flexo5{
  background-image:url('img/Flexometrode5m.jpg');
}

.item-card.flexo8{
  background-image:url('img/Flexometrode8m.JPG');
}

.item-card.hombrera{
  background-image:url('img/Hombreradecuero.JPG');
}

.item-card.kit{
  background-image:url('img/KitAntitraumaMSAModel10063431.JPG');
  background-size:contain;
  background-repeat:no-repeat;
  background-color:#0f172a;
}

.item-card.llaveCarraca{
  background-image:url('img/LlaveCarrracaALFMANQLF-RW1922.jpg');
}

.item-card.llaveF8{
  background-image:url('img/LlaveFrancesa8.jpg');
}

.item-card.llaveF12{
  background-image:url('img/LlaveFrancesa12.JPG');
}

.item-card.llaveM22{
  background-image:url('img/LlaveMixta22mm.JPG');
}

.item-card.martillo{
  background-image:url('img/MartilloAndamieroALFMANACFH0075.jpg');
}

.item-card.nivel{
  background-image:url('img/NiveldeManoSTANLEY9.JPG');
}

.item-card.rodillera{
  background-image:url('img/Rodillera.JPG');
}

.item-card.balde{
  background-image:url('img/BaldelainerodelonaHAUK.png');
}

.item-card.polea{
  background-image:url('img/PoleaconFrenoSECURPULLEY.jpg');
}

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --primary:#1e40af;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#dbe3ef;
  --ok:#16a34a;
  --danger:#dc2626;
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:1300px;
  margin:auto;
  padding:18px;
}

.topbar{
  background:linear-gradient(135deg,#1e40af,#2563eb);
  color:white;
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.topbar h1{
  margin:0 0 6px;
}

.topbar p{
  margin:0;
  opacity:.95;
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.btn{
  border:none;
  border-radius:14px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
}

.stat .num{
  font-size:30px;
  font-weight:900;
}

.stat .label{
  color:var(--muted);
  font-weight:700;
}

.search-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.search-card input{
  width:100%;
  padding:14px;
  border:1px solid #cfd8e3;
  border-radius:14px;
  font-size:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:16px;
  align-items:start;
}

.item-card{
  border:2px solid rgba(255,255,255,0.4);
  border-radius:18px;
  padding:16px;
  transition:.2s ease;
  cursor:pointer;
  aspect-ratio:1 / 1;
  min-height:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  color:white;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  box-shadow:var(--shadow);
}
.item-card h3{
  margin:0 0 10px;
  font-size:17px;
  color:#0f172a;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.badge.total{background:#e5edff;color:#1e40af;}
.badge.ok{background:#dcfce7;color:#166534;}
.badge.danger{background:#fee2e2;color:#991b1b;}

.detail{
  display:none;
  margin-top:12px;
  overflow:auto;
}

.item-card.open .detail{
  display:block;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
  text-align:left;
}

th{
  background:#f8fafc;
  color:#374151;
}

.estado{
  font-weight:800;
}

.estado.disponible{
  color:var(--ok);
}

.estado.entregado{
  color:var(--danger);
}

.loading{
  text-align:center;
  font-weight:800;
  padding:30px;
}

@media(max-width:1200px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:980px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:640px){
  .stats,
  .grid{
    grid-template-columns:1fr;
  }

  .item-card{
    min-height:150px;
    aspect-ratio:auto;
  }

  .item-card:hover{
    transform:none;
  }
}
}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <h1>📦 Inventario de Herramientas</h1>
    <p>Consulta visual del maestro de herramientas</p>
  </div>

  <div class="actions">
    <a class="btn btn-secondary" href="index.html">⬅ Volver al menú</a>
    <a class="btn btn-primary" href="herramientas.html">Registrar entrega</a>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="totalHerramientas">0</div>
      <div class="label">Herramientas</div>
    </div>
    <div class="stat">
      <div class="num" id="totalDisponibles">0</div>
      <div class="label">Disponibles</div>
    </div>
    <div class="stat">
      <div class="num" id="totalEntregadas">0</div>
      <div class="label">Entregadas</div>
    </div>
    <div class="stat">
      <div class="num" id="totalCajas">0</div>
      <div class="label">Cajas</div>
    </div>
  </div>

  <div class="search-card">
    <input type="text" id="buscar" placeholder="🔍 Buscar por herramienta, código, serie, marca o caja...">
  </div>

  <div id="loading" class="loading">Cargando inventario...</div>
  <div class="grid" id="contenedorInventario"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxzoRJ6iPz4ivS75kgUWg5vaK2OkcGE2WPmM-fDpQF-ztpnFmrSSBH3MStUsWEnmyHcvA/exec";

let inventarioOriginal = [];

document.addEventListener("DOMContentLoaded", () => {
  cargarInventario();
  document.getElementById("buscar").addEventListener("input", filtrarInventario);
});

async function cargarInventario(){
  try{
    const res = await fetch(API_URL + "?action=getInventarioHerramientas");
    const data = await res.json();

    if(!data.ok){
      throw new Error(data.message || "Error al cargar inventario");
    }

    inventarioOriginal = data.inventario || [];
    pintarResumen(inventarioOriginal);
    pintarInventario(inventarioOriginal);

  }catch(err){
    document.getElementById("loading").textContent = "Error: " + err.message;
  }
}

function pintarResumen(data){
  const disponibles = data.filter(x => normal(x.estado) === "DISPONIBLE").length;
  const entregadas = data.filter(x => normal(x.estado) === "ENTREGADO").length;
  const cajas = new Set(data.map(x => x.caja).filter(Boolean));

  document.getElementById("totalHerramientas").textContent = data.length;
  document.getElementById("totalDisponibles").textContent = disponibles;
  document.getElementById("totalEntregadas").textContent = entregadas;
  document.getElementById("totalCajas").textContent = cajas.size;
}

function pintarInventario(data){
  const loading = document.getElementById("loading");
  const contenedor = document.getElementById("contenedorInventario");

  loading.style.display = "none";
  contenedor.innerHTML = "";

  const agrupado = {};

  data.forEach(item => {
    const key = item.item || "SIN NOMBRE";
    if(!agrupado[key]) agrupado[key] = [];
    agrupado[key].push(item);
  });

  Object.keys(agrupado).sort((a,b)=>a.localeCompare(b,"es")).forEach(nombre => {
    const lista = agrupado[nombre];
    const disponibles = lista.filter(x => normal(x.estado) === "DISPONIBLE").length;
    const entregadas = lista.filter(x => normal(x.estado) === "ENTREGADO").length;

    const card = document.createElement("div");
    card.className = "item-card " + obtenerClaseImagen(nombre);

    card.innerHTML = `
      <h3>${nombre}</h3>

      <div class="badges">
        <span class="badge total">Total: ${lista.length}</span>
        <span class="badge ok">Disponibles: ${disponibles}</span>
        <span class="badge danger">Entregadas: ${entregadas}</span>
      </div>

      <button class="btn btn-primary" type="button" onclick="toggleDetalle(this)">
        Ver detalle
      </button>

      <div class="detail">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Serie</th>
              <th>Marca</th>
              <th>Caja</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(x => `
              <tr>
                <td>${x.codigo || "-"}</td>
                <td>${x.serie || "-"}</td>
                <td>${x.marca || "-"}</td>
                <td>${x.caja || "-"}</td>
                <td class="estado ${normal(x.estado).toLowerCase()}">${x.estado || "-"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    contenedor.appendChild(card);
  });

  if(!data.length){
    contenedor.innerHTML = "<div class='loading'>No se encontraron resultados.</div>";
  }
}

function toggleDetalle(btn){
  const card = btn.closest(".item-card");
  card.classList.toggle("open");
  btn.textContent = card.classList.contains("open") ? "Ocultar detalle" : "Ver detalle";
}

function filtrarInventario(){
  const q = normal(document.getElementById("buscar").value);

  if(!q){
    pintarResumen(inventarioOriginal);
    pintarInventario(inventarioOriginal);
    return;
  }

  const filtrado = inventarioOriginal.filter(x => {
    const texto = normal([
      x.item,
      x.codigo,
      x.serie,
      x.marca,
      x.caja,
      x.estado
    ].join(" "));
    return texto.includes(q);
  });

  pintarResumen(filtrado);
  pintarInventario(filtrado);
}
function obtenerClaseImagen(nombre){
  const n = normal(nombre);

  if(n.includes("ARNES MECANICO 6")) return "arnes6";
  if(n.includes("ARNES MECANICO 4")) return "arnes4";
  if(n.includes("BLOQUE RETRACTIL")) return "bloque";
  if(n.includes("CABO EN Y CON")) return "caboCon";
  if(n.includes("CABO EN Y SIN")) return "caboSin";
  if(n.includes("CAJA HERRAMIENTAS")) return "caja";
  if(n.includes("CORREAJE")) return "correaje";
  if(n.includes("FAJA ANCLAJE MSA DOBLE ARGOLLA 0.9")) return "faja09";
  if(n.includes("FAJA ANCLAJE MSADOBLE") || n.includes("FAJA ANCLAJE MSA DOBLE ARGOLLA 1.8")) return "faja18";
  if(n.includes("FLEXOMETRO DE 5")) return "flexo5";
  if(n.includes("FLEXOMETRO DE 8")) return "flexo8";
  if(n.includes("HOMBRERA")) return "hombrera";
  if(n.includes("KIT ANTITRAUMA")) return "kit";
  if(n.includes("LLAVE CARRRACA")) return "llaveCarraca";
  if(n.includes("LLAVE FRANCESA 8")) return "llaveF8";
  if(n.includes("LLAVE FRANCESA 12")) return "llaveF12";
  if(n.includes("LLAVE MIXTA")) return "llaveM22";
  if(n.includes("MARTILLO")) return "martillo";
  if(n.includes("NIVEL")) return "nivel";
  if(n.includes("RODILLERA")) return "rodillera";
  if(n.includes("BALDE")) return "balde";
  if(n.includes("POLEA")) return "polea";

  return "";
}
function normal(v){
  return String(v || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
</script>

</body>
</html>
