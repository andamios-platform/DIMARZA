<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Herramientas</title>
 
  
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#1e40af;
  --primary2:#2563eb;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#dbe3ef;
  --danger:#dc2626;
  --ok:#16a34a;
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:1600px;
  margin:0 auto;
  padding:18px;
}

.topbar{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.topbar h1{
  margin:0 0 6px 0;
  font-size:28px;
}

.topbar p{
  margin:0;
  opacity:.95;
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.btn{
  border:none;
  border-radius:14px;
  padding:12px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  box-shadow:var(--shadow);
}

.btn-primary{ background:var(--primary); color:#fff; }
.btn-secondary{ background:#e5e7eb; color:#111827; }

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
}

.stat .num{
  font-size:30px;
  font-weight:900;
  color:#0f172a;
}

.stat .label{
  color:var(--muted);
  font-weight:700;
}

.search-card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.search-card input{
  width:100%;
  padding:14px;
  border:1px solid #cfd8e3;
  border-radius:14px;
  font-size:16px;
}

.equipos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:22px;
}

.equipo-card{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  transition:.25s;
}

.equipo-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 35px rgba(0,0,0,.18);
}

.equipo-img{
  height:220px;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  background-color:#fff;
  border-bottom:1px solid #ececec;
}

.equipo-info{
  padding:18px;
}

.equipo-title{
  font-size:17px;
  font-weight:800;
  color:#1f2937;
  min-height:48px;
  line-height:1.25;
}

.contadores{
  display:flex;
  justify-content:space-between;
  margin-top:14px;
  margin-bottom:14px;
  gap:8px;
}

.contador{
  flex:1;
  text-align:center;
}

.contador h3{
  margin:0;
  font-size:24px;
}

.contador span{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
}

.disponible h3{ color:#16a34a; }
.entregado h3{ color:#dc2626; }
.total h3{ color:#2563eb; }

.btn-detalle{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.detail{
  display:none;
  padding:16px;
  border-top:1px solid #eee;
  background:#fafafa;
  overflow:auto;
}

.equipo-card.open .detail{
  display:block;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  background:#f3f4f6;
}

th,td{
    padding:8px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
    vertical-align:middle;
}

.estado.disponible{
  color:#16a34a;
  font-weight:bold;
}

.estado.entregado{
  color:#dc2626;
  font-weight:bold;
}

.loading{
  text-align:center;
  font-weight:800;
  padding:30px;
}

@media(max-width:980px){
  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:640px){
  .app{
    padding:10px;
  }

  .topbar{
    padding:16px;
    border-radius:18px;
  }

  .topbar h1{
    font-size:20px;
  }

  .stats,
  .equipos-grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
  }
}

  .modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;

    justify-content:center;
    align-items:center;

    padding:25px;
}

.modal-contenido{

    background:white;

    width:100%;
    max-width:950px;

    border-radius:20px;

    padding:25px;

    max-height:90vh;

    overflow:auto;

    position:relative;

    animation:aparecer .25s ease;
}

@keyframes aparecer{

from{

transform:scale(.9);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

.cerrar{

position:absolute;

right:18px;

top:12px;

font-size:35px;

cursor:pointer;

font-weight:bold;

}

.modal-img{

width:230px;

height:230px;

background-size:contain;

background-repeat:no-repeat;

background-position:center;

margin:auto;

margin-bottom:20px;

}

.modal h2{

text-align:center;

margin-bottom:20px;

}

.modal-resumen{

display:flex;

justify-content:center;

gap:35px;

margin-bottom:20px;

font-weight:bold;

font-size:18px;

}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <h1>📦 Inventario de Herramientas</h1>
    <p>Consulta visual del maestro de herramientas</p>
  </div>

  <div class="actions">
    <a class="btn btn-secondary" href="visualizacion.html">⬅ Volver a visualización</a>
    <a class="btn btn-primary" href="herramientas.html">Registrar entrega</a>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="totalHerramientas">0</div>
      <div class="label">Herramientas</div>
    </div>

    <div class="stat">
      <div class="num" id="totalDisponibles">0</div>
      <div class="label">Disponibles</div>
    </div>

    <div class="stat">
      <div class="num" id="totalEntregadas">0</div>
      <div class="label">Entregadas</div>
    </div>

    <div class="stat">
      <div class="num" id="totalCajas">0</div>
      <div class="label">Cajas</div>
    </div>
  </div>

  <div class="search-card">
    <input type="text" id="buscar" placeholder="🔍 Buscar por herramienta, código, serie, marca o caja...">
  </div>

  <div id="loading" class="loading">Cargando inventario...</div>
  <div class="equipos-grid" id="contenedorInventario"></div>

</div>

<script>


  
const API_URL = "https://script.google.com/macros/s/AKfycbzeGyXppcnE2oomHXbmbDkUBLAFMgwNG13lAerVBxtP_kxNUdy5vtrDf9Oh5cJxr6nLqg/exec";

const IMAGENES = {
  "ARNES MECANICO 6": "img/ArnésMecánico6argollas.JPG",
  "ARNES MECANICO 4": "img/ArnésMecánico4argollas.jpg",
  "BALDE": "img/BaldelainerodelonaHAUK.png",
  "BLOQUE RETRACTIL": "img/BloqueRetráctilSafewazeDobleLatitude-Pde1.8mGanchoEscala.JPG",
  "CABO EN Y CON": "img/CaboenYMSAconamortiguadordeimpacto.png",
  "CABO EN Y SIN": "img/Cabosinamortiguadordeimpacto.jpg",
  "CABO EN Y MSA SIN": "img/Cabosinamortiguadordeimpacto.jpg",
  "CAJA HERRAMIENTAS": "img/CajaHerramientasdeplácticoTRUPPER.JPG",
  "CORREAJE": "img/CorreajedeAndamiero.JPG",
  "DRIZA": "img/Cabosinamortiguadordeimpacto.jpg",
  "FAJA ANCLAJE MSA DOBLE ARGOLLA 0.9": "img/FajaAnclajeMSAdobleargolla0.9m.jpg",
  "FAJA ANCLAJE MSADOBLE": "img/FajaAnclajeMSAdobleargolla1.8M.JPG",
  "FAJA ANCLAJE MSA DOBLE ARGOLLA 1.8": "img/FajaAnclajeMSAdobleargolla1.8M.JPG",
  "FLEXOMETRO DE 5": "img/Flexometrode5m.jpg",
  "FLEXOMETRO DE 8": "img/Flexometrode8m.JPG",
  "HOMBRERA": "img/Hombreradecuero.JPG",
  "KIT ANTITRAUMA": "img/KitAntitraumaMSAModel10063431.JPG",
  "LLAVE CARRACA": "img/LlaveCarracaALFMANQLF-RW1922.jpg",
  "LLAVE FRANCESA 12": "img/LlaveFrancesa12.JPG",
  "LLAVE FRANCESA 8": "img/LlaveFrancesa8.jpg",
  "LLAVE MIXTA": "img/LlaveMixta22mm.JPG",
  "MARTILLO": "img/MartilloAndamieroALFMANACFH0075.jpg",
  "NIVEL": "img/NiveldeManoSTANLEY9.JPG",
  "POLEA": "img/PoleaconFrenoSECURPULLEY.jpg",
  "PORTA CARRACA": "img/portacarraca.jpg",
  "PORTA MARTILLO": "img/portamartillo.jpg",
  "RODILLERA": "img/Rodillera.JPG"
};
 
let inventarioOriginal = [];

document.addEventListener("DOMContentLoaded", () => {
  cargarInventario();
  document.getElementById("buscar").addEventListener("input", filtrarInventario);
});

async function cargarInventario(){
  try{
    const res = await fetch(API_URL + "?action=getInventarioHerramientas");
    const data = await res.json();

    if(!data.ok){
      throw new Error(data.message || "Error al cargar inventario");
    }

    inventarioOriginal = data.inventario || [];
    pintarResumen(inventarioOriginal);
    pintarInventario(inventarioOriginal);

  }catch(err){
    document.getElementById("loading").textContent = "Error: " + err.message;
  }
}

function pintarResumen(data){

  const activos = data.filter(x =>
  (x.codigo || "").trim() !== "" &&
  !normal(x.item).includes("DRIZA")
);

  const disponibles = activos.filter(x => normal(x.estado) === "DISPONIBLE").length;

  const entregadas = activos.filter(x => normal(x.estado) === "ASIGNADO").length;

  const cajas = new Set(activos.map(x => x.caja).filter(Boolean));

  document.getElementById("totalHerramientas").textContent = activos.length;
  document.getElementById("totalDisponibles").textContent = disponibles;
  document.getElementById("totalEntregadas").textContent = entregadas;
  document.getElementById("totalCajas").textContent = cajas.size;
}

function pintarInventario(data){
  const loading = document.getElementById("loading");
  const contenedor = document.getElementById("contenedorInventario");

  loading.style.display = "none";
  contenedor.innerHTML = "";

  const agrupado = {};

  data.forEach(item => {
    const key = item.item || "SIN NOMBRE";
    if(!agrupado[key]) agrupado[key] = [];
    agrupado[key].push(item);
  });

  Object.keys(agrupado).sort((a,b)=>a.localeCompare(b,"es")).forEach(nombre => {
    if (normal(nombre).includes("DRIZA")) return;
    const lista = agrupado[nombre].filter(x => (x.codigo || "").trim() !== "");
    const disponibles = lista.filter(x => normal(x.estado) === "DISPONIBLE").length;
    const entregadas = lista.filter(x => normal(x.estado) === "ASIGNADO").length;
    const imagen = obtenerImagen(nombre);

    const card = document.createElement("div");
    card.className = "equipo-card";

card.innerHTML = `
<div class="equipo-img" style="background-image:url('${imagen}')"></div>

<div class="equipo-info">

  <div class="equipo-title">
    ${nombre}
  </div>

  <div class="contadores">

    <div class="contador total">
      <h3>${lista.length}</h3>
      <span>Total</span>
    </div>

    <div class="contador disponible">
      <h3>${disponibles}</h3>
      <span>Disp.</span>
    </div>

    <div class="contador entregado">
      <h3>${entregadas}</h3>
      <span>Entreg.</span>
    </div>

  </div>

</div>
`;

    card.onclick = () => abrirModal(nombre, lista, imagen);
    contenedor.appendChild(card);
  });

  if(!data.length){
    contenedor.innerHTML = "<div class='loading'>No se encontraron resultados.</div>";
  }
}

function filtrarInventario(){
  const q = normal(document.getElementById("buscar").value);

  if(!q){
    pintarResumen(inventarioOriginal);
    pintarInventario(inventarioOriginal);
    return;
  }

  const filtrado = inventarioOriginal.filter(x => {
    const texto = normal([
      x.item,
      x.codigo,
      x.serie,
      x.marca,
      x.caja,
      x.estado
    ].join(" "));

    return texto.includes(q);
  });

  pintarResumen(filtrado);
  pintarInventario(filtrado);
}

function obtenerImagen(nombre){

    const n = normal(nombre);

    // 1. Buscar coincidencia exacta
    if(IMAGENES[n]){
        return IMAGENES[n];
    }

    // 2. Buscar la coincidencia MÁS LARGA
    let mejorCoincidencia = "";
    let imagen = "img/icon-herramientas.svg";

    for(const clave in IMAGENES){

        if(n.includes(clave) && clave.length > mejorCoincidencia.length){
            mejorCoincidencia = clave;
            imagen = IMAGENES[clave];
        }

    }

    return imagen;
}

function normal(v){
  return String(v || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim();
}


  function abrirModal(nombre, lista, imagen){

const disponibles=lista.filter(x=>normal(x.estado)=="DISPONIBLE").length;

const entregadas=lista.filter(x=>normal(x.estado)=="ASIGNADO").length;

document.getElementById("contenidoModal").innerHTML=`

<div class="modal-img"

style="background-image:url('${imagen}')">

</div>

<h2>${nombre}</h2>

<div class="modal-resumen">

<div>📦 ${lista.length} Total</div>

<div>🟢 ${disponibles} Disponibles</div>

<div>🔴 ${entregadas} Entregadas</div>

</div>

<table>

<thead>

<tr>

<th>Código</th>

<th>Serie</th>

<th>Marca</th>

<th>Caja</th>

<th>Estado</th>

</tr>

</thead>

<tbody>

${lista.map(x=>`

<tr>

<td>${x.codigo||"-"}</td>

<td>${x.serie||"-"}</td>

<td>${x.marca||"-"}</td>

<td>${x.caja||"-"}</td>

<td>${x.estado}</td>

</tr>

`).join("")}

</tbody>

</table>

`;

document.getElementById("modal").style.display="flex";

}

function cerrarModal(){

document.getElementById("modal").style.display="none";

}

window.onclick=function(e){

const modal=document.getElementById("modal");

if(e.target==modal){

cerrarModal();

}
}
</script>

<div id="modal" class="modal">

  <div class="modal-contenido">

    <span class="cerrar" onclick="cerrarModal()">&times;</span>

    <div id="contenidoModal"></div>

  </div>

</div>
  
</body>
</html>
