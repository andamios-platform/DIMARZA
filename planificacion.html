<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificación - Dimarza</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  min-height:100vh;
  padding:30px;
}
.container{
  background:white;
  max-width:1100px;
  margin:auto;
  padding:30px;
  border-radius:20px;
}
h1,h2{
  text-align:center;
  color:#0f172a;
}
input,select,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
button{
  background:#0f172a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.menu{
  display:flex;
  gap:20px;
  margin-top:30px;
}
.menu button{
  height:150px;
  font-size:20px;
}
.bloque{
  display:none;
  border:1px solid #ddd;
  border-radius:15px;
  padding:20px;
  margin-top:25px;
}
.volver{
  background:#64748b;
}
.eliminar{
  background:#b91c1c;
  padding:8px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:13px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
}
th{
  background:#e5e7eb;
}
@media(max-width:768px){
  .menu{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Planificación Dimarza</h1>

<div id="menuPrincipal" class="menu">
  <button onclick="mostrarModulo('actividades')">📄 Cargar Actividades</button>
  <button onclick="mostrarModulo('gantt')">📅 Cargar Gantt</button>
</div>

<div id="moduloActividades" class="bloque">
<h2>Cargar Actividades</h2>

<button class="volver" onclick="volverMenu()">← Volver al menú</button>

<input type="text" id="parada" placeholder="Nombre de la parada">
<input type="text" id="planta" placeholder="Planta">
<input type="text" id="area" placeholder="Área">

<input type="file" id="excelActividades" accept=".xlsx,.xls">

<button onclick="procesarActividades()">Procesar Actividades</button>
<button onclick="enviarActividades()">Enviar Actividades</button>

<div id="resumenActividades"></div>
<div id="tablaActividades"></div>
</div>

<div id="moduloGantt" class="bloque">
<h2>Cargar Gantt</h2>

<button class="volver" onclick="volverMenu()">← Volver al menú</button>

<select id="paradaGantt" onchange="cargarOTsParada()">
<option value="">Seleccione parada</option>
</select>

<input type="file" id="excelGantt" accept=".xlsx,.xls">

<button onclick="procesarGantt()">Procesar Gantt</button>
<button onclick="enviarGantt()">Actualizar con Gantt</button>

<div id="resumenGantt"></div>
<div id="tablaGantt"></div>
</div>

</div>

<script>
const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwav0zWo92vEtHKq9EnaCNlBYw-3fc-Egi6WL_jSlBUJfEu3lsSJu1zzqsblWb0UHOG/exec";

let actividades = [];
let gantt = [];
let otsParada = [];

function mostrarModulo(tipo){
  document.getElementById("menuPrincipal").style.display = "none";
  document.getElementById("moduloActividades").style.display = "none";
  document.getElementById("moduloGantt").style.display = "none";

  if(tipo === "actividades"){
    document.getElementById("moduloActividades").style.display = "block";
  }

  if(tipo === "gantt"){
    document.getElementById("moduloGantt").style.display = "block";
    cargarParadas();
  }
}

function volverMenu(){
  document.getElementById("menuPrincipal").style.display = "flex";
  document.getElementById("moduloActividades").style.display = "none";
  document.getElementById("moduloGantt").style.display = "none";
}

function limpiar(v){
  return String(v || "").trim().toUpperCase();
}

async function cargarParadas(){
  try{
    const res = await fetch(WEB_APP_URL);
    const paradas = await res.json();

    const select = document.getElementById("paradaGantt");
    select.innerHTML = `<option value="">Seleccione parada</option>`;

    paradas.forEach(p=>{
      select.innerHTML += `<option value="${p}">${p}</option>`;
    });

  }catch(error){
    alert("No se pudieron cargar las paradas");
  }
}

async function cargarOTsParada(){
  const parada = document.getElementById("paradaGantt").value;

  if(!parada){
    otsParada = [];
    return;
  }

  try{
    const res = await fetch(
      WEB_APP_URL + "?accion=ots&parada=" + encodeURIComponent(parada)
    );

    otsParada = await res.json();

  }catch(error){
    alert("No se pudieron cargar las OT de la parada");
  }
}

function procesarActividades(){

  const parada = document.getElementById("parada").value.trim();
  const planta = document.getElementById("planta").value.trim();
  const area = document.getElementById("area").value.trim();

  if(!parada || !planta || !area){
    alert("Completa Parada, Planta y Área");
    return;
  }

  const file = document.getElementById("excelActividades").files[0];

  if(!file){
    alert("Selecciona el Excel de actividades");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data,{type:"array"});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];

    const filas = XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
    const encabezados = filas[6];

    const iTAG = encabezados.indexOf("TAG");
    const iTarea = encabezados.indexOf("TAREA");
    const iOT = encabezados.indexOf("OT's PM");
    const iEmpresa = encabezados.indexOf("EMPRESA");
    const iAndamios = encabezados.indexOf("Andamios");

    if(iTAG === -1 || iTarea === -1 || iOT === -1 || iEmpresa === -1 || iAndamios === -1){
      alert("No se encontraron columnas necesarias en fila 7");
      return;
    }

    actividades = [];

    for(let i=7; i<filas.length; i++){
      const fila = filas[i];

      if(limpiar(fila[iEmpresa]) === "DIMARZA" && limpiar(fila[iAndamios]) === "SI"){
        actividades.push({
          parada,
          planta,
          area,
          tag: fila[iTAG],
          ot: fila[iOT],
          tarea: fila[iTarea],
          empresa: fila[iEmpresa]
        });
      }
    }

    mostrarActividades();
  };

  reader.readAsArrayBuffer(file);
}

function mostrarActividades(){
  document.getElementById("resumenActividades").innerHTML =
  `<p><b>${actividades.length}</b> actividades encontradas.</p>`;

  let html = `<table>
    <tr>
      <th>Eliminar</th>
      <th>Parada</th>
      <th>Planta</th>
      <th>Área</th>
      <th>TAG</th>
      <th>OT</th>
      <th>Actividad</th>
      <th>Contratista</th>
    </tr>`;

  actividades.forEach((r,index)=>{
    html += `<tr>
      <td><button class="eliminar" onclick="eliminarActividad(${index})">🗑</button></td>
      <td><input value="${r.parada}" onchange="actualizarActividad(${index}, 'parada', this.value)"></td>
      <td><input value="${r.planta}" onchange="actualizarActividad(${index}, 'planta', this.value)"></td>
      <td><input value="${r.area}" onchange="actualizarActividad(${index}, 'area', this.value)"></td>
      <td><input value="${r.tag}" onchange="actualizarActividad(${index}, 'tag', this.value)"></td>
      <td><input value="${r.ot}" onchange="actualizarActividad(${index}, 'ot', this.value)"></td>
      <td><input value="${r.tarea}" onchange="actualizarActividad(${index}, 'tarea', this.value)"></td>
      <td><input value="${r.empresa}" onchange="actualizarActividad(${index}, 'empresa', this.value)"></td>
    </tr>`;
  });

  html += `</table>`;
  document.getElementById("tablaActividades").innerHTML = html;
}

function actualizarActividad(index, campo, valor){
  actividades[index][campo] = valor;
}

function eliminarActividad(index){
  actividades.splice(index, 1);
  mostrarActividades();
}

async function enviarActividades(){
  if(actividades.length === 0){
    alert("Primero procesa actividades");
    return;
  }

  const res = await fetch(WEB_APP_URL,{
    method:"POST",
    body:JSON.stringify({
      tipo:"ACTIVIDADES",
      registros:actividades
    })
  });

  alert(await res.text());

  actividades = [];
  document.getElementById("parada").value = "";
  document.getElementById("planta").value = "";
  document.getElementById("area").value = "";
  document.getElementById("excelActividades").value = "";
  document.getElementById("resumenActividades").innerHTML = "";
  document.getElementById("tablaActividades").innerHTML = "";

  cargarParadas();
}

function procesarGantt(){

  const parada = document.getElementById("paradaGantt").value;

  if(!parada){
    alert("Selecciona una parada");
    return;
  }

  const file = document.getElementById("excelGantt").files[0];

  if(!file){
    alert("Selecciona el Excel del Gantt");
    return;
  }

  if(otsParada.length === 0){
    alert("No se cargaron las OT de esta parada. Selecciona nuevamente la parada.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data,{type:"array"});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];

    const filas = XLSX.utils.sheet_to_json(sheet,{defval:""});

    gantt = filas
      .map(r => {
        const actividad = limpiar(r["Nombre de tarea"]);
        const otOriginal = limpiar(r["OT"]);

        let tipo = "";

        if (actividad.includes("ACARREO")) {
          tipo = "ACARREO";
        } else if (
          actividad.includes("DESARME") &&
          actividad.includes("ANDAMIO")
        ) {
          tipo = "DESMONTAJE";
        } else if (
          actividad.includes("ARMADO") &&
          actividad.includes("ANDAMIO")
        ) {
          tipo = "MONTAJE";
        }

        let ot = r["OT"];

        if (
          otOriginal === "" ||
          otOriginal === "--" ||
          otOriginal === "----"
        ) {
          ot = "";
        }

        return {
          ot: ot,
          actividadGantt: r["Nombre de tarea"],
          tipo: tipo,
          comienzo: r["Comienzo"],
          fin: r["Fin"],
          duracion: r["Duración"],
          personas: r["N° personas"]
        };
      })
      .filter(r => r.tipo !== "");

    mostrarGantt();
  };

  reader.readAsArrayBuffer(file);
}

function mostrarGantt(){
  const sinOT = gantt.filter(r => !r.ot).length;

  document.getElementById("resumenGantt").innerHTML =
  `<p><b>${gantt.length}</b> actividades de andamios encontradas.</p>
   <p><b>${sinOT}</b> actividades necesitan asignar OT manualmente.</p>`;

  let html = `<table>
    <tr>
      <th>Eliminar</th>
      <th>OT</th>
      <th>Tipo</th>
      <th>Actividad detectada</th>
      <th>Comienzo</th>
      <th>Fin</th>
      <th>Duración</th>
      <th>Personas</th>
    </tr>`;

  gantt.forEach((r,index)=>{

    let opcionesOT = `<option value="">Seleccione OT</option>`;

    otsParada.forEach(ot=>{
      opcionesOT += `
        <option value="${ot}" ${String(r.ot) === String(ot) ? "selected" : ""}>
          ${ot}
        </option>`;
    });

    html += `<tr>
      <td><button class="eliminar" onclick="eliminarGantt(${index})">🗑</button></td>
      <td>
        <select onchange="actualizarOTGantt(${index}, this.value)">
          ${opcionesOT}
        </select>
      </td>
      <td>${r.tipo}</td>
      <td>${r.actividadGantt}</td>
      <td>${r.comienzo}</td>
      <td>${r.fin}</td>
      <td>${r.duracion}</td>
      <td>${r.personas}</td>
    </tr>`;
  });

  html += `</table>`;
  document.getElementById("tablaGantt").innerHTML = html;
}

function actualizarOTGantt(index, valor){
  gantt[index].ot = valor;
}

function eliminarGantt(index){
  gantt.splice(index, 1);
  mostrarGantt();
}

async function enviarGantt(){
  const parada = document.getElementById("paradaGantt").value;

  if(!parada || gantt.length === 0){
    alert("Selecciona parada y procesa el Gantt");
    return;
  }

  if(gantt.some(r => !r.ot)){
    alert("Hay actividades del Gantt sin OT asignada");
    return;
  }

  const res = await fetch(WEB_APP_URL,{
    method:"POST",
    body:JSON.stringify({
      tipo:"GANTT",
      parada:parada,
      registros:gantt
    })
  });

  alert(await res.text());

  gantt = [];
  document.getElementById("excelGantt").value = "";
  document.getElementById("resumenGantt").innerHTML = "";
  document.getElementById("tablaGantt").innerHTML = "";
}
</script>

</body>
</html>
