<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andamios</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image:
      linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.65)),
      url("img/fondo.png");
      
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

      .contenedor {
        text-align: center;
      
        background-image: url("img/fondoclaro.png");
      
        background-size: cover;
        background-position: center;
      
        background-color: rgba(255,255,255,0.08);
        background-blend-mode: soft-light;

        background-repeat: no-repeat;
      
        backdrop-filter: blur(2px);
      
        padding: 40px;
      
        border-radius: 28px;
      
        border: 1px solid rgba(255,255,255,0.25);
      
        box-shadow: 0 18px 45px rgba(0,0,0,0.35);
      
        width: 100%;
        max-width: 850px;
      }

       .titulo-principal {
          display: flex;
          align-items: center;
          justify-content: center;
        
          gap: 28px;
        
          margin-bottom: 10px;
        }
        
        .logo {
          width: 180px;
          height: auto;
        }
        
        .textos-titulo {
          display: flex;
          flex-direction: column;
        
          align-items: center;
          justify-content: center;
        }
        
        .empresa {
          color: #0d3f8f;
        
          font-size: 30px;
          font-weight: 800;
        
          letter-spacing: 6px;
        
          margin-bottom: 2px;
        
          text-align: center;
        }
        
        h1 {
          margin: 0;
        
          color: #1565c0;
        
          font-size: 78px;
          font-weight: 900;
        
          letter-spacing: 2px;
        
          line-height: 1;
        
          text-align: center;
        
          text-shadow: 0 4px 12px rgba(0,0,0,0.12);
        }
    
           .sub {
          margin-top: 12px;
        
          color: #6b7280;
        
          font-size: 18px;
        
          letter-spacing: 1px;
        }

    .botones {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    a {
      text-decoration: none;
      flex: 1;
    }

      .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      
        gap: 14px;
      
        padding: 25px 18px;
      
        border-radius: 16px;
      
        color: white;
        font-weight: bold;
        font-size: 17px;
      
        transition: 0.25s;
      
        box-shadow: 0 8px 20px rgba(0,0,0,0.20);
      }
      
      .btn:hover {
        transform: translateY(-6px) scale(1.03);
      }
      
      .icono {
        width: 64px;
        height: 64px;
      }
      
      /* COLORES */
      
      .inventario {
        background: linear-gradient(135deg, #1565c0, #0d47a1);
      }
      
      .desempeno {
        background: linear-gradient(135deg, #00897b, #00695c);
      }
      
      .herramientas {
        background: linear-gradient(135deg, #ef6c00, #e65100);
      }
    .edps {
        background: linear-gradient(135deg, #7b1fa2, #4a148c);
      }

    /* 📱 MODO CELULAR */
    @media (max-width: 768px) {
      .contenedor {
        padding: 25px 20px;
      }

      
      .titulo-principal {
        flex-direction: column;
        gap: 10px;
      }
      
      .textos-titulo {
        align-items: center;
        text-align: center;
      }
      
      .logo {
        width: 90px;
      }
      
      h1 {
        font-size: 42px;
      }
      
      .empresa {
        font-size: 18px;
        letter-spacing: 4px;
      }

      .sub {
        font-size: 14px;
      }

      .botones {
        flex-direction: column;
        gap: 14px;
      }

      .btn {
        padding: 14px;
        font-size: 15px;
      }
    }

    /* 📱 CELULARES PEQUEÑOS */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .contenedor {
        padding: 20px 15px;
      }

      h1 {
        font-size: 34px;
      }
      .empresa {
        font-size: 16px;
        letter-spacing: 3px;
      }
      
      .logo {
        width: 90px;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
      }
    }

  </style>
</head>
<body>

  <div class="contenedor">
    
    <div class="titulo-principal">
    
      <img src="img/mini-logo.png" class="logo">
    
      <div class="textos-titulo">
      <div class="empresa">DIMARZA</div>
      <h1>ANDAMIOS</h1>
    
      <div class="sub">
        Sistema de Gestión y Control
      </div>
    </div>
    
    </div>
    <div class="botones">

      <a class="btn inventario" href="inventario.html">
        <img src="img/icon-inventario.svg" class="icono">
        <span>Inventario</span>
      </a>

      <a class="btn desempeno" href="evaluacion.html">
        <img src="img/icon-desempeno.svg" class="icono">
        <span>Evaluación de Desempeño</span>
      </a>

      <a class="btn herramientas" href="herramientas.html">
        <img src="img/icon-herramientas.svg" class="icono">
        <span>Herramientas</span>
      </a>
      <a class="btn edps" href="edps.html">
        <img src="img/icon-edps.svg" class="icono">
        <span>EDPS</span>
      </a>

    </div>

  </div>

</body>
</html>
