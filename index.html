<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andamios</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image:
      linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.65)),
      url("img/fondo.png");
      
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .contenedor {
      text-align: center;
    
      background-image: url("img/fondoclaro.png");
    
      background-size: cover;
      background-position: center;
    
      background-color: rgba(255,255,255,0.75);
      background-blend-mode: lighten;
    
      padding: 40px;
      border-radius: 18px;
    
      box-shadow: 0 12px 35px rgba(0,0,0,0.30);
    
      width: 100%;
      max-width: 700px;
    }

    h1 {
      margin-bottom: 10px;
      color: #1a73e8;
      font-size: 36px;
    }

    .sub {
      margin-bottom: 30px;
      color: #6b7280;
      font-size: 16px;
    }

    .botones {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    a {
      text-decoration: none;
      flex: 1;
    }

      .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      
        gap: 14px;
      
        padding: 25px 18px;
      
        border-radius: 16px;
      
        color: white;
        font-weight: bold;
        font-size: 17px;
      
        transition: 0.25s;
      
        box-shadow: 0 8px 20px rgba(0,0,0,0.20);
      }
      
      .btn:hover {
        transform: translateY(-6px) scale(1.03);
      }
      
      .icono {
        width: 55px;
        height: 55px;
      }
      
      /* COLORES */
      
      .inventario {
        background: linear-gradient(135deg, #1565c0, #0d47a1);
      }
      
      .desempeno {
        background: linear-gradient(135deg, #00897b, #00695c);
      }
      
      .herramientas {
        background: linear-gradient(135deg, #ef6c00, #e65100);
      }

    /* 📱 MODO CELULAR */
    @media (max-width: 768px) {
      .contenedor {
        padding: 25px 20px;
      }

      h1 {
        font-size: 28px;
      }

      .sub {
        font-size: 14px;
      }

      .botones {
        flex-direction: column;
        gap: 14px;
      }

      .btn {
        padding: 14px;
        font-size: 15px;
      }
    }

    /* 📱 CELULARES PEQUEÑOS */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .contenedor {
        padding: 20px 15px;
      }

      h1 {
        font-size: 24px;
      }

      .btn {
        padding: 12px;
        font-size: 14px;
      }
    }

  </style>
</head>
<body>

  <div class="contenedor">
    <h1>ANDAMIOS</h1>
    <div class="sub">Seleccione una opción</div>

    <div class="botones">

      <a class="btn inventario" href="inventario.html">
        <img src="img/icon-inventario.svg" class="icono">
        <span>Inventario</span>
      </a>

      <a class="btn desempeno" href="evaluacion.html">
        <img src="img/icon-desempeno.svg" class="icono">
        <span>Evaluación de Desempeño</span>
      </a>

      <a class="btn herramientas" href="herramientas.html">
        <img src="img/icon-herramientas.svg" class="icono">
        <span>Herramientas</span>
      </a>

    </div>
  </div>

</body>
</html>
